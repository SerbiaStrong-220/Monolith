        Много мяса - мало булки!


        Возьмите крупный кусок мяса и нарежьте его на котлетки. Каждую котлетку равномерно прожарьте на гриле. Затем возьмите булочку и разрежьте примерно пополам. Также нарежьте сыр. Положите на нижнюю булочку сначала поджаренную на гриле котлетку, затем кусочек сыра и накройте все верхней булочкой.


        Готово! Вы великолепны!
