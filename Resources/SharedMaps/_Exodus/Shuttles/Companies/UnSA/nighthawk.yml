        [bold]«Ночной ястреб»[/bold] — это карающая длань ВША, чьи дальнобойные орудия в щепки любого врага свободы на просторах галактики! Пусть праведный свет щита «Либерти» хранит вас в бою, пока вы несете истинную демократию сквозь космический вакуум под флагом нашей великой нации. Удачи, охотник.


