- proto: Paper
  entities:
  - uid: 2078
    components:
    - type: Transform
      pos: 2.204858,23.592407
      parent: 1
    - type: Paper
      stampState: paper_stamp-rd
      stampedBy:
      - reapply: False
        stampType: RubberStamp
        stampedColor: '#1F66A0FF'
        stampedName: Руководство ДМИ
      content: >-
        [head=3]Уважаемый покупатель![/head]


        [bold]"Дарк Маттер Интерпрайзес"[/bold], входящая в состав концерна [bold]Холдинг "Синтез"[/bold], выражает вам искреннюю благодарность за приобретение нашего флагманского корабля [bold]«Генширо»[/bold]. Пожалуйста, внимательно ознакомьтесь с порядком эксплуатации судна.


        [bold]Настройка реактора:[/bold]

        [italic]Внимание: При любых работах с реактором обязательно используйте антирадиационный костюм.[/italic]

        1. Вставьте стержни в реактор.

        2. Опустите стержни на [bold]50 процентов[/bold], нажимая на кнопку [bold](-)[/bold].

        3. Включите автоматику турбины кнопкой рядом с ней. Если лампы горят синим, значит автоматика работает.

        4. Выставьте выработку турбины на максимум.

        5. Не забывайте своевременно заменять стержни и ремонтировать турбину сваркой.


        [bold]Управление ловушкой руд:[/bold]

        1. Активируйте серую кнопку на мостике. Поставьте её в режим [bold]"Repeat"[/bold]. Это включит автоматический магнит ловушек руды.

        2. Для ручного сбора отключите кнопку автоматики магнита. Используйте [bold]ПОРТ 2[/bold] на консоли шаттла.


        [italic]Добро пожалывать на борт флагмана, не подведите доверие концерна Холдинг "Синтез![/italic]


        Старший инженер ДМИ, 


        [italic]Дегон Винтерхолд[/italic]
