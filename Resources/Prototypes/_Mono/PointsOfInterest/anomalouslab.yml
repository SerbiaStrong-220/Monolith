# Notes:
# The local Science lab
- type: pointOfInterest
  id: AnomalousLab
  parent: BasePOI
  name: 'Лаборатория Аномалий' # Ru-Localization
  # Exodus start - even stronger spread (1km radius, keep mostly outer)
  minimumDistance: 8000
  maximumDistance: 12500
  # Exodus end
  spawnGroup: ScienceLab
  gridPath: /Maps/_Mono/POI/anomalouslab.yml
  addComponents:
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: AnomalousLab
  mapName: 'Лаборатория Аномалий' # Ru-Localization
  mapPath: /Maps/_Mono/POI/anomalouslab.yml
  minPlayers: 0
  stations:
    AnomalousLab:
      stationProto: StandardFrontierOutpost
      # Exodus start - Territory for Anomaly Laboratory (1km)
      gridComponents:
      - type: GridTerritory
        radius: 1000
      # Exodus end
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Лаборатория Аномалий' # Ru-Localization
        - type: StationJobs
          availableJobs: {}
        - type: StationDeadDropHintExempt
