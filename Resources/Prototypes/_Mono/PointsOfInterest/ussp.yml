# Notes:
#
- type: pointOfInterest
  id: USSPCamelot
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Форт Камелот' # Ru-Localization
  # # Exodus start - even stronger spread (2.5km radius)
  minimumDistance: 12500
  maximumDistance: 16000
  # # Exodus end
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueUSSP, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce ]
  spawnGroup: Required
  gridPath: /Maps/_Exodus/POI/camelot.yml # Exodus
  addComponents:
  - type: IFF
    color: "#ccaa55"
  - type: Tower7G # Exodus-Adminbus
    range: 128

- type: gameMap
  id: USSPCamelot
  mapName: 'Форт Камелот' # Ru-Localization
  mapPath: /Maps/_Exodus/POI/camelot.yml # Exodus
  minPlayers: 0
  stations:
    USSPCamelot:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
        - type: VesselMusic
          ambientMusicPrototype: CamelotMusic
        - type: VesselInfo
          description: "Ветхая станция, некогда принадлежавшая СССП. Холодно и темно." # Ru-Localization
        # # Exodus start - Territory circle for this USSP station (use 2500 or 5000 as appropriate)
        #
        # Design rule (strict):
        # - Default for any station/POI is "Незанято" (unclaimed).
        # - No default faction belonging via controllingFaction in GridTerritory.
        # - To have initial ownership, map a physical banner entity (with `type: TerritoryBanner` in yaml)
        #   anchored on the grid in the actual map file.
        # - Removing the banner (wrench) always leads to unclaimed state.
        #
        # Do not set controllingFaction here for lore "default owner".
        - type: GridTerritory
          radius: 2500
          # No controllingFaction, no defaultLabel → falls back to "Незанято".
        # # Exodus end
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Форт Камелот' # Ru-Localization
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Storage/Crates/secure_ammo.rsi
            state: icon
          stationSubtext: 'frontier-lobby-camelot-subtext'
          stationDescription: 'frontier-lobby-camelot-description'
          lobbySortOrder: 4
        - type: StationJobs
          availableJobs:
            # USSPCommissar: [1, 1]
            # USSPSergeant: [4, 4]
            # USSPCorporal: [6, 6]
            # USSPMedic: [4, 4]
            # USSPRifleman: [-1, -1]
            Contractor: [-1, -1]
            Pilot: [0, -1]
            Mercenary: [0, -1]
          tags:
          - USSPCommand
        - type: StationDeadDrop
          maxDeadDrops: 2 # Fewer here, players start here.
