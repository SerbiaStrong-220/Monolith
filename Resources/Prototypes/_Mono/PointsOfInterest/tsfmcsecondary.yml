- type: pointOfInterest
  id: TSFMCOutpost
  parent: [BasePOI, BaseRepairablePOI]
  name: 'КВП | Периферийный аванпост' # Ru-Localization
  # Exodus start - even stronger spread (1km radius, outer)
  minimumDistance: 13000
  maximumDistance: 17500
  # Exodus end
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueTSF, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce ]
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/tsfmcoutpost.yml
  addComponents:
  - type: IFF
    color: "#047abd"
    flags: [HideLabel]
    readOnly: true # mono

- type: gameMap
  id: TSFMCOutpost
  mapName: 'КВП | Периферийный аванпост' # Ru-Localization
  mapPath: /Maps/_Mono/POI/tsfmcoutpost.yml
  minPlayers: 0
  stations:
    TSFMCOutpost:
      stationProto: SecurityFrontierOutpost
      # Exodus start - Territory grid control for peripheral outpost (1km radius)
      gridComponents:
      - type: GridTerritory
        radius: 1000
      # Exodus end
      components:
        - type: StationNameSetup
          mapNameTemplate: 'КВП | Периферийный аванпост' # Ru-Localization
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Decoration/banner.rsi
            state: nfsd-banner
          stationSubtext: 'frontier-lobby-tsfmc-secondary-subtext'
          stationDescription: 'frontier-lobby-tsfmc-secondary-description'
          lobbySortOrder: 2
        - type: StationJobs
          availableJobs:
            SeniorOfficer: [ 0, 3 ]
            Brigmedic: [ 0, 1 ]
            Deputy: [ -1, -1 ]
          tags:
          - HeadOfPersonnel
          - HeadOfSecurity
        - type: StationDeadDropHintExempt
