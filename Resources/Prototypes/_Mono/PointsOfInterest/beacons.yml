# Exodus: resource clusters are generated only by worldgen, not as automatic POIs.
# Their beacon maps remain registered for manual loading.

- type: gameMap
  id: BeaconClusterA
  mapName: 'INSO-357k Asteroid Cluster'
  mapPath: /Maps/_Exodus/POI/beaconstation_a.yml
  minPlayers: 0
  stations:
    BeaconClusterA:
      stationProto: RecordsFrontierOutpost
      components:
      - type: StationNameSetup
        mapNameTemplate: 'INSO-357k Asteroid Cluster'

- type: gameMap
  id: BeaconWilds
  mapName: 'LINEAR-21 Asteroid Cluster'
  mapPath: /Maps/_Exodus/POI/beaconstation_wilds.yml
  minPlayers: 0
  stations:
    BeaconWilds:
      stationProto: RecordsFrontierOutpost
      components:
      - type: StationNameSetup
        mapNameTemplate: 'LINEAR-21 Asteroid Cluster'
- type: gameMap
  id: EmptyFrontierBeacon
  mapName: Beacon
  mapPath: /Maps/_Mono/POI/beaconstation_empty.yml
  minPlayers: 0
  randomRotation: true
  maxRandomOffset: 3000
  stations:
    Empty:
      stationProto: StandardFrontierStation
      gridComponents:
      - type: IFF
        color: "#ccaa55"
      - type: SolarPoweredGrid
        doNotCull: true
      components:
      - type: StationNameSetup
        mapNameTemplate: "Empty"
