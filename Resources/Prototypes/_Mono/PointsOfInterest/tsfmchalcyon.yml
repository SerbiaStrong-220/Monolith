- type: pointOfInterest
  id: TSFMCHalcyon
  parent: [BasePOI, BaseRepairablePOI]
  name: 'КВП | Флагман Фалкон' # Ru-Localization
  # # Exodus start - even stronger spread (2.5km radius): further out + widened for separation
  minimumDistance: 8800
  maximumDistance: 12800
  # # Exodus end
  spawnGamePreset: [ NFAdventure, NFPirate, MonoStandard, MonoRogueTSF, MonoTSFUSSP, MonoADS, MonoChimera, MonoMixed, MonoAllAtOnce ]
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/tsfmchalcyon.yml
  addComponents:
  - type: IFF
    color: "#047abd"
    readOnly: true
  - type: SolarPoweredGrid
    doNotCull: true

- type: gameMap
  id: TSFMCHalcyon
  mapName: 'КВП | Флагман Фалкон' # Ru-Localization
  mapPath: /Maps/_Mono/POI/tsfmchalcyon.yml
  minPlayers: 0
  randomRotation: false
  stations:
    TSFMCHalcyon:
      stationProto: SecurityFrontierOutpost
      gridComponents:
      - type: VesselInfo
        description: "Законсервированный военный корабль КВП, переоборудованный в передовую оперативную базу." # Ru-Localization
      # # Exodus start - Territory claim circle for this major TSF station (Large radius)
      #
      # Design rule:
      # - Every station defaults to "Незанято" / unclaimed.
      # - A station never "belongs" to a faction by default (ontologically impossible).
      # - If it must start claimed by a faction, place the actual banner entity (e.g. BannerNGC)
      #   anchored on the grid inside the map file itself. The banner system will pick it up on load.
      # - When the claim banner is removed (unscrewed), ControllingFaction becomes null and it shows
      #   the neutral text (defaultLabel or "Незанято").
      #
      # Do not use controllingFaction in this GridTerritory for "home faction" default.
      # The radar text for claims always comes from the current active banner's TerritoryFactionPrototype.
      #
      # Radius is free-form.
      - type: GridTerritory
        radius: 2500
        # No controllingFaction and no defaultLabel override → truly unclaimed / "Незанято" when no banner.
      # # Exodus end
      components:
        - type: StationNameSetup
          mapNameTemplate: 'КВП | Флагман Фалкон' # Ru-Localization
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Decoration/banner.rsi
            state: nfsd-banner
          stationSubtext: 'frontier-lobby-nfsd-subtext'
          stationDescription: 'frontier-lobby-nfsd-description'
          lobbySortOrder: 2
        - type: StationJobs
          availableJobs:
            Sheriff: [ 1, 1 ]
            Bailiff: [1, 1 ]
            SeniorOfficer: [ 3, 3 ] # Mono
            Brigmedic: [ 2, 2 ] # Mono
            Deputy: [ -1, -1 ] # Mono
            Cadet: [ 6, 6 ] # Exodus-Cadet-Return
            TsfEngineer: [ 2, 2 ]
            TsfBorg: [ 2, 2 ]
          tags:
          - HeadOfPersonnel
          - HeadOfSecurity
        - type: StationDeadDropReporting
          messageSet: Nfsd
        - type: StationDeadDropHintExempt
