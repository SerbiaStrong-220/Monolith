# Notes: upgraded zenith as a ruin w/ tech disks
- type: pointOfInterest
  id: HammerOfTheUnion
  parent: [BaseMobilePOI, BaseRepairablePOI] # Exodus SRD snapshot is inherited from BaseRepairablePOI.
  name: 'Молот Союза' # Ru-Localization
  # Exodus placement is controlled by HammerNearFervidus instead of the ordinary sector annulus.
  spawnGroup: Required
  gridPath: /Maps/_Mono/POI/Dungeons/hammeroftheunion.yml
  addComponents:
  # Exodus-begin USSP affiliation; preserve the ruin's existing hidden-label behavior.
  - type: NpcFactionMember
    factions: [USSP]
  - type: IffAffiliation
    mode: Faction
    faction: USSP
  # Exodus-end
  - type: IFF
    color: "#ff0033" # Exodus USSP
    flags: [HideLabel]

- type: gameMap
  id: USSPHammer
  mapName: 'Молот Союза' # Ru-Localization
  mapPath: /Maps/_Mono/POI/Dungeons/hammeroftheunion.yml
  minPlayers: 0
  stations:
    HammerOfTheUnion:
      stationProto: StandardFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Молот Союза' # Ru-Localization
        - type: StationJobs
          availableJobs: {}
        - type: StationDeadDropHintExempt
