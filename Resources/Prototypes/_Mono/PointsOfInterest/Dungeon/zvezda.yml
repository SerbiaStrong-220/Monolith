# Notes:
- type: pointOfInterest
  id: Zvezda
  parent: [BasePOI, BaseRepairablePOI] # Exodus repair snapshot is inherited exactly once
  name: 'Среда Обитания "Звезда"' # Exodus
  minimumDistance: 20000 # Exodus-nebula-update
  maximumDistance: 30000 # Exodus-nebula-update
  spawnGroup: Optional # Exodus keep normal POI distribution
  gridPath: /Maps/_Exodus/POI/Dungeons/zvezda.yml # Exodus upstream map at owned path
  addComponents:
  - type: IFF
    color: "#17bf65"
    readOnly: true

- type: gameMap
  id: Zvezda
  mapName: 'Среда Обитания "Звезда"' # Exodus
  mapPath: /Maps/_Exodus/POI/Dungeons/zvezda.yml # Exodus upstream map at owned path
  minPlayers: 0
  stations:
    Zvezda:
      stationProto: RecordsFrontierOutpostCargo
      gridComponents:
      - type: StationCargoOrderDatabase
        capacity: 240
      - type: TradeCrateDestination
        destinationProto: Trade
      - type: StationDeadDrop
        maxDeadDrops: 12
      - type: VesselInfo
        description: "Полузаброшенная разрушающаяся станция. Иногда слышно, как изгибается её корпус. ЭТО НЕ БЕЗОПАСНАЯ ЗОНА, НА СТАНЦИИ МОГУТ БЫТЬ ОПАСНОСТИ." # Exodus
      - type: VesselMusic
        ambientMusicPrototype: CamelotMusic
      # Exodus-begin territory-grid
      - type: GridTerritory
      # Exodus-end
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Среда Обитания "Звезда"' # Exodus
        - type: ExtraStationInformation
          icon:
            sprite: _NF/Structures/Storage/Crates/secure_ammo.rsi
            state: icon
          stationSubtext: 'frontier-lobby-zvezda-subtext'
          stationDescription: 'frontier-lobby-zvezda-description'
          lobbySortOrder: 5
        - type: StationJobs
          availableJobs:
            # Exodus: only mercenaries spawn on Zvezda.
            Mercenary: [ -1, -1 ] # Exodus round-start and latejoin spawn
        - type: StationDeadDropHintExempt
