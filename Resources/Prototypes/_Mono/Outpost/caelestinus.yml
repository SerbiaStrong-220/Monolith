- type: gameMap
  id: Frontier
  mapName: 'Колосс-Централ' # Exodus Ru-Localization
  mapPath: /Maps/_Exodus/Outpost/colossus_central.yml # Exodus
  minPlayers: 0
  maxPlayers: 100
  randomRotation: false # SS220 keep Central orientation
  maxRandomOffset: 0
  stations:
    Frontier:
      stationProto: StandardFrontierStation
      gridComponents:
      - type: IFF
        color: "#37946e"
        readOnly: true
      - type: StationDeadDrop
        maxDeadDrops: 2
      - type: StationCargoOrderDatabase
        capacity: 240
      - type: TradeCrateDestination
        destinationProto: Trade
      - type: VesselMusic
        ambientMusicPrototype: ColossusCentralMusic
      - type: VesselInfo
        description: "Последний рубеж цивилизации этого сектора. Ты чувствуешь себя в безопасности... почти." # Exodus Ru-Localization
      - type: Zone # Exodus - SafeZone
        text: "zone-safezone"
      # Exodus start - Territory grid control
      - type: GridTerritory
        defaultLabel: territory-marker-colossus
      # Exodus end
      - type: Tower7G # Exodus-Adminbus
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Колосс-Централ' # Exodus Ru-Localization
#          nameGenerator:
#            !type:NanotrasenNameGenerator
#            prefixCreator: '14'
        - type: ExtraStationInformation
          icon: /Textures/_Mono/Logo/icon/icon-256x256.png # used the biggest one, looks better when downscaling than upscaling
          stationSubtext: 'frontier-lobby-frontier-subtext'
          stationDescription: 'frontier-lobby-frontier-description'
          lobbySortOrder: 1
        # - type: StationPlanetSpawner # Mono - Commented out planet spawner (for now)
        #   planet: DesertWorld
        #   gridPath: /Maps/_Mono/POI/surface_outpost_desert.yml
        - type: StationJobs
          availableJobs:
            Contractor: [ -1, -1 ]
            Pilot: [ -1, -1 ] # SS220 keep Central pilot spawn
            Mercenary: [ -1, -1 ] # SS220 keep Central mercenary spawn
            Borg: [ -1, -1 ]
            ColossusSecurityBorg: [ 1, 1 ] # Exodus colossus-security-borg
            StationRepresentative: [ 1, 1 ]
            StationTrafficController: [ 2, 2 ]
            SecurityGuard: [ 3, 3 ]
            CCServiceWorker: [ 2, 2 ]
            NFJanitor: [ 2, 2 ]
            MailCarrier: [ 2, 2 ]
            DirectorOfCare: [ 1, 1 ]
            MdMedic: [ -1, -1 ]
          tags:
          - HeadOfPersonnel
          - HeadOfSecurity
        - type: Announcer

- type: gameMap
  id: EmptyFrontier
  mapName: Empty
  mapPath: /Maps/Test/empty.yml
  minPlayers: 0
  stations:
    Empty:
      stationProto: StandardFrontierStation
      components:
        - type: StationNameSetup
          mapNameTemplate: "Empty"
