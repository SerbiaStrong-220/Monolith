- type: entity
  parent: BaseItem
  id: BaseBitcoin
  # Exodus: name and description are localized in FTL.
  abstract: true
  components:
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_pickup.ogg
      params:
        volume: -6
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/disk_drop.ogg
      params:
        volume: -6
  - type: Sprite
    sprite: _Mono/Objects/Misc/bitcoin.rsi
    layers:
    - state: icon
    - state: fluffcoin
  - type: DriftingPrice
    minInitial: 8000
    maxInitial: 12000
    basePrice: 10000
    stability: 0.4
    driftRate: 0.025

