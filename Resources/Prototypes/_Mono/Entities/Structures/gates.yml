- type: entity
  parent: BaseLogicItem
  id: SignalTimerItem
  name: timer
  description: Sends a signal after a specified time after receiving a signal.
  components:
  # Exodus-begin: retain the value of the four steel sheets recovered on deconstruction.
  - type: StaticPrice
    price: 23.6
  # Exodus-end
  - type: Sprite
    layers:
    - state: base
    - sprite: _Mono/Objects/Devices/gates.rsi
      state: timer
  - type: Construction
    node: timer
  - type: SignalTimer
    canEditLabel: false
  - type: DeviceLinkSource
    ports:
    - Start
    - Timer
  - type: DeviceLinkSink
    ports:
    - Trigger
  - type: ActivatableUI
    key: enum.SignalTimerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SignalTimerUiKey.Key:
        type: SignalTimerBoundUserInterface
