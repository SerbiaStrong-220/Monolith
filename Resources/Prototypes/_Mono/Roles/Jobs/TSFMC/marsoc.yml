- type: job
  id: TsfMarsoc
  name: job-name-tsf-marsoc
  description: job-description-tsf-marsoc
  playTimeTracker: JobTsfMarsoc
  requirements:
  # Exodus-begin: faction veteran requirements use existing job playtime.
  - !type:DepartmentTimeRequirement
    department: ExodusTSFPlaytime
    time: 360000 # 100 hours in TSF roles
  - !type:OverallPlaytimeRequirement
    time: 720000 # 200 hours overall, including faction playtime
  # Exodus-end
  startingGear: MarsocOperativeGearHyperwarRole
  icon: JobIconTSFMarsoc
  supervisors: job-supervisors-exodus-marsoc # Exodus local and high command hierarchy
  alwaysUseSpawner: true # Exodus use the base's dedicated marker for late joins too.
  weight: 45
  displayWeight: 45
  assignedCompany: TSF
  canBeAntag: false
  setPreference: true
  accessGroups:
  - AllAccess
  access:
  - TsfmcEngineering
  special:
  - !type:AddComponentSpecial
    components:
    - type: NpcFactionMember
      factions:
      - TSFMC
    - type: ChatRank
      rank: exodus-marsoc-rank # Exodus localized base role; reinforcement ranks are unchanged.
    # Exodus-begin: issue the species-appropriate survival box after the fixed backpack is equipped.
    - type: Loadout
      roleLoadout: [ExodusMarsocSurvival]
    # Exodus-end
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, TrackingImplant, BluespaceLifelineImplant ] # Exodus match reinforcement implants for the lobby operative.
  - !type:AddLanguageSpecial
    languagesSpoken:
    - SolCommon
    languagesUnderstood:
    - SolCommon

- type: startingGear
  id: MarsocOperativeGearHyperwarRole
  # Exodus: neck and wallet equipment are supplied by the lobby loadout; the backpack is fixed starting gear.
  equipment:
    jumpsuit: ClothingUniformTsfmcMopp
    back: ClothingBackpackERTLeader # Exodus: always issue the backpack, independent of saved loadout groups.
    eyes: ClothingEyesHudNfsd
    ears: ClothingHeadsetAltTsfmcCommander # Exodus Colonel's headset without the CentCom channel; reinforcement gear is unchanged.
    gloves: ClothingHandsGlovesTacticalCombatBlack
    outerClothing: ClothingOuterHardsuitM86Mk4
    suitstorage: WeaponEnergyHalberdMARSOC # Exodus: issue the halberd on the lobby operative's rear armor mount.
    shoes: ClothingShoesBootsMagAdv
    id: MarsocPDA
    pocket1: CrowbarPocket
    pocket2: RadioHandheldNF
    belt: ClothingBeltWebbingsNormalTSFMC
  inhand:
  - UndeterminedTSFMarsocKit
  # Exodus-begin: fixed backpack contents are inserted after the backpack is equipped.
  storage:
    back:
    - BaseSecurityUplinkRadioOfficer
    - BookTSFSOP
    - WeaponPistolMk58
    - BoxMagazine45_ACPFMJ
    - ArmorPlatePierce
    - EncryptionKeyTraffic
  # Exodus-end
