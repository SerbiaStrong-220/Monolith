- type: job
  id: VGCommander
  name: job-name-vg-commander
  description: job-description-vg-commander
  playTimeTracker: JobVGCommander
  # Exodus-begin enable-viper-group
  whitelisted: false
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 144000 # 40 hrs
  # Exodus-end
  startingGear: ViperCommanderGear
  alwaysUseSpawner: true
  hideConsoleVisibility: true
  icon: "JobIconVGCommander" # TODO - new USSP icons
  supervisors: job-supervisors-vg-commander
  canBeAntag: false
  weight: 10 #Going off the info I was given, low weight as it's a company-whitelist role.
  displayWeight: 52
  assignedCompany: TheViperGroup
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, ViperTrackingImplant ]
  - !type:AddComponentSpecial
    components:
    - type: MailDisabled
    - type: SpecialSectorStationRecord
      recordGeneration: FalseRecord
    - type: NpcFactionMember
      factions:
      - VG
    - type: ChatRank
      rank: vg-commander
  - !type:AddLanguageSpecial
    languagesSpoken:
    - NovaCygniBasic
    languagesUnderstood:
    - NovaCygniBasic
  accessGroups:
  - GeneralAccess
  - ViperHigh

- type: startingGear
  id: ViperCommanderGear
  storage:
    back:
    - RadioHandheldNF
    - VGHandheldOverwatchConsole
