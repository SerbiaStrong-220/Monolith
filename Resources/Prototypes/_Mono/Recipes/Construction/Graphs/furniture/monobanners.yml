- type: constructionGraph
  id: MonoBannersGraph
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: BannerTSFNode
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 2
              doAfter: 1
          # # Exodus start - enforce single territory claim banner
          conditions:
          - !type:NoActiveTerritoryClaimOnGrid {}
          # # Exodus end
        - to: BannerSHMNode
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 2
              doAfter: 1
          # # Exodus start - enforce single territory claim banner
          conditions:
          - !type:NoActiveTerritoryClaimOnGrid {}
          # # Exodus end
        - to: BannerDINode
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 2
              doAfter: 1
          # # Exodus start - enforce single territory claim banner
          conditions:
          - !type:NoActiveTerritoryClaimOnGrid {}
          # # Exodus end
        # # Exodus start - build edge for Khsira placeholder (затычка)
        - to: BannerKhsiraNode
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 2
              doAfter: 1
            - material: Cloth
              amount: 2
              doAfter: 1
          # # Exodus start - enforce single territory claim banner (затычка)
          conditions:
          - !type:NoActiveTerritoryClaimOnGrid {}
          # # Exodus end
        # # Exodus end

    - node: BannerTSFNode
      entity: BannerNGC
      edges:
      - to: start
        completed:
        - !type:SpawnPrototype
          prototype: SheetSteel1
          amount: 2
        - !type:SpawnPrototype
          prototype: MaterialCloth1
          amount: 2
        steps:
        - tool: Screwing
          doAfter: 1

    - node: BannerSHMNode
      entity: BannerSHM
      edges:
      - to: start
        completed:
        - !type:SpawnPrototype
          prototype: SheetSteel1
          amount: 2
        - !type:SpawnPrototype
          prototype: MaterialCloth1
          amount: 2
        steps:
        - tool: Screwing
          doAfter: 1

    - node: BannerDINode
      entity: BannerDrakeIndustries
      edges:
      - to: start
        completed:
        - !type:SpawnPrototype
          prototype: SheetSteel1
          amount: 2
        - !type:SpawnPrototype
          prototype: MaterialCloth1 #todo replace that with some fine ass textiles (NEW TRADE GOODS ?!)
          amount: 2
        steps:
        - tool: Welding
          doAfter: 3

    # # Exodus start - node for Khsira placeholder banner (затычка)
    # Temporary until real sprite and proper deconstruct tool are provided.
    - node: BannerKhsiraNode
      entity: BannerKhsira
      edges:
      - to: start
        completed:
        - !type:SpawnPrototype
          prototype: SheetSteel1
          amount: 2
        - !type:SpawnPrototype
          prototype: MaterialCloth1
          amount: 2
        steps:
        - tool: Screwing
          doAfter: 1
    # # Exodus end
