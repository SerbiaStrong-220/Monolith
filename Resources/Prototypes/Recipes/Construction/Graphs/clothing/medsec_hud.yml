# SS220: retained localized construction tag names; upstream graph changes integrated.
- type: constructionGraph
  id: HudMedSec
  start: start
  graph:
    - node: start
      edges:
        - to: medsecHud
          steps:
            - tag: HudMedical
              name: construction-graph-tag-medical-hud
              icon:
                sprite: Clothing/Eyes/Hud/med.rsi
                state: icon
              doAfter: 5
            - tag: HudSecurity
              name: construction-graph-tag-security-hud
              icon:
                sprite: Clothing/Eyes/Hud/sec.rsi
                state: icon
              doAfter: 5
            - material: Cable
              amount: 5
              doAfter: 5
            # SS220-begin keep radio construction requirement
            - tag: Radio
              name: construction-graph-tag-radio
              icon:
                sprite: _NF/Objects/Devices/communication.rsi # Frontier
                state: base # Frontier
              doAfter: 5
            # SS220-end
            - material: Capacitor
              amount: 1
              doAfter: 5
            - tag: MicroprocessorEconomy1
              name: construction-graph-tag-microprocessor # Exodus: localize upstream construction requirement.
              icon:
                sprite: _Mono/Objects/Materials/bayponents.rsi
                state: "microprocessor1"
              doAfter: 5
    - node: medsecHud
      entity: ClothingEyesHudMedSec
