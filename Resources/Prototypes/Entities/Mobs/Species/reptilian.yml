- type: entity
  save: false
  name: Urisst' Mzhand
  parent: BaseMobSpeciesOrganic # Exodus: claws are supplied by the genome.
  id: BaseMobReptilian
  abstract: true
  components:
  - type: Genome # Exodus: compact native adaptations.
    initialMutations: [GeneticGrowingClaws, GeneticColdDependence, GeneticThermophilic] # Exodus
  - type: HumanoidAppearance
    species: Reptilian
    hideLayersOnEquip:
    - Snout
#    - HeadTop # WWDP - Because visible horns its cool
    - HeadSide
  - type: Hunger
  - type: Puller
    needsHands: false
  - type: Thirst
  - type: Icon
    sprite: Mobs/Species/Reptilian/parts.rsi
    state: full
  - type: Body
    prototype: Reptilian
    requiredLegs: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatLizard
      amount: 5
  - type: LizardAccent
  - type: Speech
    speechSounds: Lizard
    speechVerb: Reptilian
    allowedEmotes: ['Thump']
  - type: TypingIndicator
    proto: lizard
  - type: Vocal
    sounds:
      Male: MaleReptilian
      Female: FemaleReptilian
      Unsexed: MaleReptilian
  - type: LanguageKnowledge # Einstein Engines - Languages
    speaks:
    - TauCetiBasic
    - Draconic
    understands:
    - TauCetiBasic
    - Draconic
  - type: BodyEmotes
    soundsId: ReptilianBodyEmotes
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: GeneticReptilianBaseline # Exodus: thermal adaptations are genes.
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Blunt: 3 # Mono
    attackRate: 1.5
  # Exodus: temperature limits and slowdown are supplied by native genes.
  - type: Wagging
  - type: Inventory
    speciesId: reptilian
    # WWDP-Edit-Start
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit-female
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: shoes
    # WWDP-Edit-End
  - type: Tag # Mono/Goobstation
    tags:
    - ReptilianEmotes
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - AnomalyHost
    - Humanoid
  # Mono edit start
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 250 # weighs more than humans because tail.
        restitution: 0.0
        mask:
          - MobMask
        layer:
          - MobLayer
  # Exodus: cold dependence and warming effects are supplied by native genes.
  # Mono edit end

