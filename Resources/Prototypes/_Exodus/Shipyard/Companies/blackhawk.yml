# Blackhawk PMC — company-gated fleet.

- type: vessel
  id: BlackhawkKortic
  parent: BaseVessel
  name: company-vessel-blackhawk-kortic-name
  description: company-vessel-blackhawk-kortic-description
  price: 92300 # Exodus: appraised minimum + 5%, rounded up to 100.
  category: Small
  group: Shipyard
  requiredCompanies:
  - blackhawkpmc
  shuttlePath: /SharedMaps/_Exodus/Shuttles/Companies/blackhawk/kortic.yml
  addComponents:
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  class:
  - Mercenary
  engine:
  - AME
  limit: 4

- type: gameMap
  id: BlackhawkKortic
  mapName: 'Блэкхок Кортик'
  mapPath: /SharedMaps/_Exodus/Shuttles/Companies/blackhawk/kortic.yml
  minPlayers: 0
  stations:
    BlackhawkKortic:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Кортик{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs:
          Contractor: [ 0, 0 ]
          Pilot: [ 0, 0 ]
          Mercenary: [ 0, 0 ]

