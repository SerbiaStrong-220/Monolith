- type: vessel
  id: HMIpod
  parent: BaseVessel
  name: company-vessel-HMI-pod-name
  description: company-vessel-HMI-pod-desc
  price: 12000
  category: Micro
  group: Custom
  mapchecker_group_override: Shipyard
  shuttlePath: /SharedMaps/_Exodus/Shuttles/Companies/HMI/hmipod.yml
  addComponents:
  - type: NpcFactionMember
    factions:
    - NanoTrasen
  guidebookPage: Null
  class:
  - Medical
  engine:
  - APU

- type: gameMap
  id: HMIpod
  mapName: 'ХМИ Труповозка'
  mapPath: /SharedMaps/_Exodus/Shuttles/Companies/HMI/hmipod.yml
  minPlayers: 0
  stations:
    HMIpod:
      stationProto: StandardFrontierVessel
      components:
      - type: StationNameSetup
        mapNameTemplate: 'Труповозка{1}'
        nameGenerator:
          !type:NanotrasenNameGenerator
          prefixCreator: '14'
      - type: StationJobs
        availableJobs: {}
