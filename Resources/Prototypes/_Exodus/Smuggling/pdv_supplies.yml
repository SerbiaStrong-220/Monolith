- type: entity
  parent: MarkerBase
  id: SpawnExodusPdvSupplyCrate
  name: PDV supply crate spawner
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: _Exodus/Structures/Storage/Crates/pdv_supply_1.rsi
      state: icon
  - type: RandomSpawner
    prototypes:
    - CrateExodusPdvSupply1
    - CrateExodusPdvSupply1
    - CrateExodusPdvSupply2
    - CrateExodusPdvSupply3
    - CrateExodusPdvSupply4
