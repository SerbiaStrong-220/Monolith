- type: entity
  parent: CrateTradeContrabandSecure1
  id: CrateExodusPdvSupply1
  name: Phaethon Dynasty supply crate
  description: Sealed Vanguard supplies. Selling the intact crate at a cargo depot pays the courier and funds PDV requisitions.
  components:
  - type: ExtendDescription
    descriptionList:
    - description: exodus-sale-funds-pdv
      color: "#4f94ad"
      requireDetailRange: true
  - type: CurrencyInjectionOnSell
    company: PDV
    amount:
      Doubloon: 10
  - type: Icon
    sprite: _Exodus/Structures/Storage/Crates/pdv_supply_1.rsi
    state: icon
  - type: Sprite
    sprite: _Exodus/Structures/Storage/Crates/pdv_supply_1.rsi
    layers:
    - state: icon
    - sprite: _NF/Interface/Misc/cargo_destination_icons.rsi
      state: cargo_other
      offset: 0.275,-0.265
      map: ["enum.TradeCrateVisualLayers.Icon"]
      visible: false
    - sprite: _NF/Interface/Misc/cargo_destination_icons.rsi
      state: cargo_priority_inactive
      offset: 0.025,-0.265
      map: ["enum.TradeCrateVisualLayers.Priority"]
      visible: false
    - state: paper
      sprite: Structures/Storage/Crates/labels.rsi
      offset: "-0.5,0"
      map: ["enum.PaperLabelVisuals.Layer"]

