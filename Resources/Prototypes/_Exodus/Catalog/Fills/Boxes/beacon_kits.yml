# Fixed Asakim/ADS shuttle beacon packs for the summoning-machine gamble crate.
# Each pack is a cardboard box with a fixed StorageFill — no per-beacon RNG.

- type: entity
  id: BoxAsakimBeaconKitBase
  parent: BoxCardboard
  abstract: true
  suffix: Filled
  components:
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,2

# Семейство — full Zenith line
- type: entity
  id: BoxAsakimBeaconKitFamily
  parent: BoxAsakimBeaconKitBase
  name: beacon pack "Family"
  description: Three Zenith-line call beacons — baseline, A-variant, and E-variant.
  components:
  - type: StorageFill
    contents:
    - id: ADSShuttleEmergencyBeaconZenith
    - id: ADSShuttleEmergencyBeaconZenithA
    - id: ADSShuttleEmergencyBeaconZenithE

# Близнецы — double Concord
- type: entity
  id: BoxAsakimBeaconKitTwins
  parent: BoxAsakimBeaconKitBase
  name: beacon pack "Twins"
  description: A matched pair of Concord-X call beacons.
  components:
  - type: StorageFill
    contents:
    - id: ADSShuttleEmergencyBeaconConcordX
      amount: 2

