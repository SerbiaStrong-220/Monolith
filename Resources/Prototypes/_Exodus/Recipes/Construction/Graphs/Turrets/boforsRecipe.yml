- type: constructionGraph
  id: Bofors
  start: start
  graph:
  - node: start
    edges:
    - to: feed_loaded
      steps:
      - tool: Anchoring
        doAfter: 2
      - tool: Screwing
        doAfter: 2
      - material: Cable
        amount: 5
      - tool: Cutting
        doAfter: 2
      - tag: BoforsFeedItem
        name: construction-graph-tag-BoforsFeedItem
        doAfter: 4

  - node: feed_loaded
    edges:
    - to: data_loaded
      steps:
      - tool: Screwing
        doAfter: 1
      - tag: BoforsDataDisk
        name: construction-graph-tag-BoforsDataDisk
        doAfter: 2

  - node: data_loaded
    edges:
    - to: targeting_loaded
      steps:
      - tool: Screwing
        doAfter: 1
      - tag: BoforsTargetingItem
        name: construction-graph-tag-BoforsTargetingItem
        doAfter: 2

  - node: targeting_loaded
    edges:
    - to: barrels_loaded
      steps:
      - tool: Screwing
        doAfter: 1
      - material: Iridite
        amount: 20
      - tool: Anchoring
        doAfter: 1
      - tool: Welding
        doAfter: 1
      - tag: BoforsBarrelItem
        name: construction-graph-tag-BoforsBarrelItem
        doAfter: 7

  - node: barrels_loaded
    edges:
    - to: bofors
      steps:
      - tool: Anchoring
        doAfter: 2

  - node: bofors
    actions:
    - !type:SpawnPrototype
      prototype: BoforsWorkPiece
      amount: 1
    - !type:DeleteEntity
