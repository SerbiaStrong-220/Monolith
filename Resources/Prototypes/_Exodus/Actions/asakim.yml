- type: entity
  id: ActionAsakimCenturionEmergencyScram
  name: emergency displacement
  description: Automatically injects combat stabilizers and performs an emergency random teleport when the wearer enters critical condition.
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    checkCanInteract: false
    checkConsciousness: false
    useDelay: 60
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Structures/Specific/anomaly.rsi
      state: anom4
    event: !type:AsakimCenturionEmergencyScramActionEvent

- type: entity
  id: ActionAsakimKatanaDash
  name: phase dash
  description: Dash to a visible location.
  categories: [ HideSpawnMenu ]
  components:
  - type: WorldTargetAction
    useDelay: 30
    range: 0
    itemIconStyle: NoItem
    checkCanAccess: false
    repeat: false
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: blink
    sound:
      path: /Audio/Magic/blink.ogg
      params:
        volume: 5
    event: !type:DashEvent
