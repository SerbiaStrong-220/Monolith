- type: entity
  id: ActionLeviathanSurge
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    useDelay: 30
    itemIconStyle: NoItem
    icon:
      sprite: _Exodus/Interface/Actions/leviathan_surge.rsi
      state: icon
    event: !type:TemporarySpeedBoostActionEvent

- type: entity
  id: ActionLeviathanShowRadar
  parent: ActionAGhostShowRadar
  categories: [ HideSpawnMenu ]
  components:
  - type: InstantAction
    itemIconStyle: NoItem
- type: entity
  id: ActionShowBluespaceMap
  categories: [ HideSpawnMenu ]
  name: bluespace map
  description: View the sector map.
  components:
  - type: InstantAction
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: mass_scanner
    event: !type:ToggleIntrinsicUIEvent
      key: enum.ReadOnlyBluespaceMapUiKey.Key
