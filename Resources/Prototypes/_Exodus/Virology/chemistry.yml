# Diagnostic reagents. Exodus uses its existing neuroprotective reagent in the synthesis chain.
- type: reagent
  id: Nicergoline
  name: reagent-name-nicergoline
  group: Medicine
  desc: reagent-desc-nicergoline
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#e4a010"
  metabolisms:
    Medicine:
      effects: []

- type: reaction
  id: Nicergoline
  reactants:
    Desoxyephedrine:
      amount: 1
    Mannitol:
      amount: 1
    Oxygen:
      amount: 1
  products:
    Nicergoline: 3

- type: reagent
  id: Heparin
  name: reagent-name-heparin
  group: Medicine
  desc: reagent-desc-heparin
  physicalDesc: reagent-physical-desc-translucent
  flavor: medicine
  color: "#d0e21b"
  metabolisms:
    Medicine:
      effects:
      - !type:ModifyBleedAmount
        conditions:
        - !type:ReagentThreshold
          reagent: Heparin
          min: 15
        amount: 0.25

- type: reaction
  id: Heparin
  reactants:
    SulfuricAcid:
      amount: 1
    Nitrogen:
      amount: 1
    Sodium:
      amount: 1
  products:
    Heparin: 2
