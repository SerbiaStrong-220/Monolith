# Harmony Medical - advanced surgical synth organs.
# Buffs use the existing organ effects plus a source-aware damage protection aggregator.

- type: entity
  parent: BioSynthHeart
  id: HmeSynthHeart
  name: hme-synth-heart-name
  description: hme-synth-heart-description
  components:
  # Asakim-style: stronger metabolizer on the organ itself (no custom body component).
  - type: Metabolizer
    maxReagents: 4
    metabolizerTypes: [ Human ]
    groups:
    - id: Medicine
      rateModifier: 1.3
    - id: Cryogenic
    - id: Poison
      rateModifier: 1.15
    - id: Narcotic

- type: entity
  parent: HmeSynthHeart
  id: HmeSynthHeartFortified
  name: hme-synth-heart-fortified-name
  description: hme-synth-heart-fortified-description
  components:
  - type: Organ
    onAdd:
    - type: HealthThresholdModifier
      multiplier: 1.25

- type: entity
  parent: BioSynthLungs
  id: HmeSynthLungs
  name: hme-synth-lungs-name
  description: hme-synth-lungs-description
  components:
  - type: Organ
    onAdd:
    - type: StaminaModifier
      modifier: 1.2
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Human ]
    groups:
    - id: Gas
      rateModifier: 120.0

- type: entity
  parent: BioSynthLiver
  id: HmeSynthLiver
  name: hme-synth-liver-name
  description: hme-synth-liver-description
  components:
  - type: OrganDamageProtection
    modifiers:
      poison:
        id: HmeLiverProtection
        coefficients:
          Poison: 0.8
  - type: Metabolizer
    maxReagents: 3
    metabolizerTypes: [ Human ]
    groups:
    - id: Medicine
    - id: Poison
      rateModifier: 1.35
    - id: Narcotic

- type: entity
  parent: BioSynthEyes
  id: HmeSynthEyes
  name: hme-synth-eyes-name
  description: hme-synth-eyes-description
  components:
  - type: Organ
    onAdd:
    - type: FlashImmunity
    - type: EyeProtection

- type: entity
  parent: BioSynthLeftLeg
  id: HmeSynthLeftLeg
  name: hme-synth-left-leg-name
  description: hme-synth-left-leg-description
  components:
  - type: MovementBodyPart
    walkSpeed: 2.7
    sprintSpeed: 4.85

- type: entity
  parent: BioSynthRightLeg
  id: HmeSynthRightLeg
  name: hme-synth-right-leg-name
  description: hme-synth-right-leg-description
  components:
  - type: MovementBodyPart
    walkSpeed: 2.7
    sprintSpeed: 4.85
