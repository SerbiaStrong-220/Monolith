    sprite: _Exodus/Mobs/Special/organs.rsi
    layers:
    - state: brain
  - type: Item
    sprite: _Exodus/Mobs/Special/organs.rsi
    heldPrefix: brain
  - type: StaticPrice
    price: 90000

- type: entity
