- type: entity
  abstract: true
  parent: PartSkeletonBase
  id: PartLivingSkeleton
  name: living skeleton body part
  components:
  - type: Sprite
    sprite: _Exodus/Mobs/Species/Skeleton/parts.rsi
  - type: Icon
    sprite: _Exodus/Mobs/Species/Skeleton/parts.rsi
  - type: BodyPart
    species: LivingSkeleton

- type: entity
  parent: [ PartLivingSkeleton, BaseTorsoInorganic ]
  id: TorsoLivingSkeleton
  name: skeleton torso

# No MindTransferTarget tag: death must not transfer the player into an immortal skull.
- type: entity
  parent: [ PartLivingSkeleton, BaseHead ]
  id: HeadLivingSkeleton
  name: skull
  components:
  - type: Sprite
    state: skull_icon
  - type: Icon
    state: skull_icon
  - type: Tag
    tags:
    - Head

