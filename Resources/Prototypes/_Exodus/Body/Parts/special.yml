- type: entity
  id: PartSpecial
  parent: [BaseItem, BasePart]
  abstract: true
  name: Special body part
  components:
  - type: Sprite
    sprite: _Exodus/Mobs/Special/parts.rsi
  - type: Icon
    sprite: _Exodus/Mobs/Special/parts.rsi
  - type: BodyPart
    species: Special
    severIntegrity: 600
    vitalDamage: 900
    healingTime: 10
    selfHealingAmount: 5
    integrityThresholds:
      CriticallyWounded: 450
      HeavilyWounded: 375
      ModeratelyWounded: 300
      SomewhatWounded: 200
      LightlyWounded: 100
      Healthy: 50
  - type: Damageable
    damageModifierSet: Special
  - type: StaticPrice
    price: 90000
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Ichor
        Quantity: 20

- type: entity
  id: TorsoSpecial
  parent: [PartSpecial, BaseTorso]
  name: Special torso
  components:
  - type: Sprite
    state: torso
  - type: Icon
    state: torso
  - type: BodyPart
    severIntegrity: 600
    vitalDamage: 900
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 1800
      behaviors:
      - !type:GibPartBehavior {}

