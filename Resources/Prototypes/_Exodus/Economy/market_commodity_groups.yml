# Commodity groups describe production complexity and scale trade pressure, not base prices.
- type: marketCommodityGroup
  id: General
  name: market-commodity-group-general
  default: true

- type: marketCommodityGroup
  id: Gases
  name: market-commodity-group-gases
  gases: true
  impactMultiplier: 0.003

- type: marketCommodityGroup
  id: RawMaterials
  name: market-commodity-group-raw-materials

- type: marketCommodityGroup
  id: HighPrecision
  name: market-commodity-group-high-precision

- type: marketCommodityGroup
  id: UltraPrecision
  name: market-commodity-group-ultra-precision

# Resource families include unprocessed ores, refined sheets, animal materials
# and scrap. Material/Stack alone also match food, medicine and currency.
- type: marketCommodityRule
  id: RawResourceFamilies
  group: RawMaterials
  priority: 100
  parents:
  - OreBase
  - MaterialBase
  - PartBase
  - IngotBase
  - SheetMetalBase
  - SheetGlassBase
  - SheetOtherBase
  - BaseScrap
  - BaseScrapLarge
  - ShardBase
  - ShardCrystalBase
  - FuelPlasma
  - FuelUranium
  - FuelBananium
  prototypes:
  - ArmorPlateEconomy1Broken
  - ArmorPlateEconomy2Broken
  - ArmorPlateEconomy3Broken
  - ArmorPlateEconomy4Broken
  - ArmorPlateEconomy3Fragment
  - SiliconWaferScrapEconomy
  - SiliconBouleScrapEconomy
  tags:
  - Ore
  - RawMaterial
  - RockMaterial
  - SandMaterial
  - MothroachHide
  - MaterialHideRosyMothroach
  - SpaceLeviathanChitin
  excludeComponents:
  - Food
  - Drink

# Completed machines combine separately produced boards, parts and a frame.
# Basic boards, electronics and printed organs have no blanket High rule.
- type: marketCommodityRule
  id: HighAssembledEquipment
  group: HighPrecision
  priority: 150
  components:
  - Machine
  - Computer
  - Mech

# These complete devices also have ordinary single-printer flatpack recipes.
# Use their simplest production route rather than their Machine component.
- type: marketCommodityRule
  id: GeneralPrintedEquipment
  group: General
  priority: 160
  prototypes:
  - GasMiningDrill
  - GasMiningDrillFlatpack
  - GaslockFrame
  - GaslockFrameFlatpack
  - NFMagnetBoxOre
  - OreBoxFlatpack
  - NFMagnetBoxConstruction
  - MaterialBoxFlatpack
  - NFMagnetBoxRubbish
  - ScrapBoxFlatpack
  - SolarAssembly
  - SolarAssemblyFlatpack
  - NFVehicleJanicartKey
  - JanicartFlatpack
  - HydroponicsSoilNutrition
  - HydroponicsSoilNutritionFlatpack
  - ShipArmorModuleBlackhawk
  - ShipArmorModuleBlackhawkFlatpack
  - WeaponTurretDravon
  - WeaponTurretDravonFlatpack

