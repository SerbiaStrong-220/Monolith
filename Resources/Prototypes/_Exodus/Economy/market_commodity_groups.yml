# Americium requires corporate synthesis from processed nuclear materials.
- type: marketCommodityRule
  id: UltraAmericium
  group: UltraPrecision
  priority: 300
  stackTypes:
  - Americium

# Repair drones and fleet interdiction equipment have restricted acquisition
# or require americium and other products of lengthy production chains.
- type: marketCommodityRule
  id: UltraFleetEquipment
  group: UltraPrecision
  priority: 300
  components:
  - ShipRepairDrone
  - ShipRepairStation
  - FtlSuppressor
  prototypes:
  - ShipRepairDroneStationMachineCircuitboard
  - ShipRepairDroneStationFlatpack
  - MachineFtlSuppressorTsfFlatpack
  - MachineFtlSuppressorPdvFlatpack

