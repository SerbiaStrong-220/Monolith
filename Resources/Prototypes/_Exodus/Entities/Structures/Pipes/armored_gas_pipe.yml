# Uses the normal PipeNode/PipeNet simulation with an isolated fitting group.
- type: entity
  abstract: true
  parent: GasPipeSansLayers
  id: GasPipeArmoredBase
  name: armored gas pipe
  description: A ribbed, armored conduit for corrosive refinery exhaust. Its fittings are incompatible with ordinary atmospheric pipes.
  components:
  - type: ShipRepairable
    repairTime: 2
    repairCost: 5
  - type: Sprite
    sprite: _Exodus/Structures/Pipes/armored_gas_pipe.rsi
  - type: Item
    sprite: _Exodus/Structures/Pipes/armored_gas_pipe.rsi
  - type: PipeAppearance
    sprite:
    - { sprite: _Exodus/Structures/Pipes/armored_gas_pipe.rsi, state: pipeConnector }
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
      - !type:SpawnEntitiesBehavior
        spawn:
          GasPipeArmoredBroken:
            min: 1
            max: 1
        offset: 0
      - !type:DoActsBehavior
        acts: [Breakage]
  - type: PhysicalComposition
    materialComposition:
      Steel: 0
      Plasteel: 200
  - type: StaticPrice
    price: 60

- type: entity
  parent: GasPipeArmoredBase
  id: GasPipeArmoredHalf
  name: armored gas pipe (capped)
  components:
  - type: NodeContainer
    nodes:
      pipe: !type:PipeNode
        nodeGroupID: ExodusArmoredGasPipe
        pipeDirection: South
  - type: Sprite
    layers:
    - state: pipeHalf
      map: ["enum.PipeVisualLayers.Pipe"]
  - type: Construction
    graph: GasPipeArmored
    node: half
  - type: Item
    size: Small
    storedSprite:
      sprite: _Exodus/Structures/Pipes/armored_gas_pipe.rsi
      state: storageHalf

