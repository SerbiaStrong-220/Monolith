- type: entity
  parent: UnfinishedMachineFrame3x3
  id: UnfinishedMachineFrame5x5
  name: machine frame (5x5)
  description: A large machine under construction. Needs more parts.
  suffix: Unfinished
  components:
  - type: Construction
    graph: Machine5x5
  - type: Sprite
    offset: 0, 0
    scale: 1.666667, 1.666667
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-2.4,-2.4,2.4,2.4"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer

- type: entity
  parent: MachineFrame3x3
