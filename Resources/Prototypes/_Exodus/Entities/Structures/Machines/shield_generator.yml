- type: entity
  id: ShieldGeneratorMS750
  parent: ShieldGeneratorBase
  name: MS-750 "Prometheus" Shield Generator
  description: Pre-fracture shielding salvaged from a sealed armoury. Massive capacity, radiates while active, and overloads catastrophically.
  suffix: ADS ONLY
  components:
  - type: ShipShieldEmitter
    damageLimit: 1000000
    healPerSecond: 1150
    damageExp: 1.05
    powerModifier: 0.10024
    baseDraw: 100000
    maxDraw: 200000
    unpoweredBonus: 6
    damageOverloadTimePunishment: 40
    shieldColor: "#D4AF37"
    collisionResistanceMultiplier: 0.05
  - type: ExplodeOnShieldOverload
    explosionType: HardBomb
    totalIntensity: 4000
    intensitySlope: 3
    maxTileIntensity: 400
  - type: RadiationSource
    intensity: 10
    slope: 4.17
    enabled: false
  - type: PoweredRadiationSource
  - type: RadarBlip
    radarColor: "#D4AF37"
    visibleFromOtherGrids: true
    scale: 3
    shape: diamond
    gridConfig:
      color: "#D4AF37"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1.5,-1.5,1.5,1.5"
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/shield.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#D4AF37"
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#D4AF37"
  - type: ApcPowerReceiver
    powerLoad: 100000
  - type: Machine
    board: MachineShieldMS750Circuitboard
  - type: Construction
    graph: MachineImmovable
    node: machine
    deconstructionTarget: null
    containers:
    - machine_board
    - machine_parts
  - type: Anchorable
    flags: Anchorable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ShipRepairable
    repairTime: 60
    repairCost: 750
  - type: ShipRepairableRestrict
    toolWhitelist:
      tags:
      - ADSRepairTool

- type: entity
  id: ShieldGeneratorMS1000
  parent: ShieldGeneratorMS750
  name: MS-1000 "Triptych" Shield Generator
  description: A white resonant shield generator that projects three nested field layers. A critical overload collapses one layer and vents part of the stored load before the core is exposed.
  suffix: ADS ONLY
  components:
  - type: ShipShieldEmitter
    damageLimit: 1250000
    healPerSecond: 1300
    baseDraw: 110000
    maxDraw: 240000
    damageOverloadTimePunishment: 35
    shieldColor: "#FFFFFF"
    deflectionDamageModifier: 0.65
  - type: LayeredShipShield
    layerCount: 3
    layerThickness: 0.35
    layerGap: 0.9
    collapseDamageFraction: 0.55
    recoveryDamageThreshold: 0.55
    recoveryInterval: 15 # seconds
    deflectionDamageModifierStep: 0.2
  - type: RadarBlip
    radarColor: "#FFFFFF"
    gridConfig:
      color: "#FFFFFF"
      shape: Square
      respectZoom: true
      rotate: true
      bounds: "-1.5,-1.5,1.5,1.5"
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/shield.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#FFFFFF"
  - type: PointLight
    color: "#FFFFFF"
  - type: ApcPowerReceiver
    powerLoad: 110000
# POI Low-End — mechanically a Sentinel (MS-100) but ram-immune and POI-only.
# Lives only on hand-built POI stations; cannot be constructed or deconstructed.
- type: entity
  id: ShieldGeneratorPOISmall
  parent: ShieldGeneratorBase
  name: FS-411 "Outpost" Shield Generator
  description: The Outpost. A static-deployment derivative of the Sentinel - same compact
    profile and recharge cycle, hardened against kinetic impacts for fixed installations.
  suffix: POI ONLY
  components:
  - type: ShipShieldEmitter
    damageLimit: 65000
    healPerSecond: 500
    damageExp: 1.05
    baseDraw: 20000
    maxDraw: 60000
    unpoweredBonus: 3
    damageOverloadTimePunishment: 80
    shieldColor: "#FF9933"
    collisionResistanceMultiplier: 0.0
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/fobshield.rsi
    snapCardinals: true
    layers:
    - state: fobshield
    - state: fobshield_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#FF9933"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
          - 194 # oxygen
          - 0 # nitrogen
          - 0 # carbon dioxide
          - 6 # plasma
          temperature: 752.48
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Explosive
    explosionType: Default
    maxIntensity: 4000
    intensitySlope: 4
    totalIntensity: 300
  - type: ApcPowerReceiver
    powerLoad: 20000
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#FF9933"
  - type: ShipRepairable
    repairTime: 20
    repairCost: 125
  - type: Anchorable
    flags:
    - None

# Civil Defense Militia corporate shield. Uses the reliable small shield platform with a green field.
- type: entity
  id: ShieldGeneratorCdm
  parent: ShieldGeneratorSmall
  name: cdm-shield-generator-name
  description: cdm-shield-generator-description
  components:
  - type: Machine
    board: ShieldGeneratorCdmMachineCircuitboard
  - type: ShipShieldEmitter
    shieldColor: "#48C96B"
  - type: Sprite
    sprite: _Exodus/Structures/ShuttleComponents/cdm_shield_generator.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#48C96B"
    - sprite: _Exodus/Structures/ShuttleComponents/cdm_shield_generator.rsi
      state: reserve_0
      map: ["enum.CdmShieldReserveVisualLayers.Cartridges"]
  - type: GenericVisualizer
    snapCardinals: true
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.CdmShieldReserveVisuals.CartridgeCount:
        enum.CdmShieldReserveVisualLayers.Cartridges:
          0: { state: reserve_0 }
          1: { state: reserve_1 }
          2: { state: reserve_2 }
          3: { state: reserve_3 }
          4: { state: reserve_4 }
  - type: ItemSlots
    slots:
      cdm-shield-reserve-0:
        name: cdm-shield-reserve-slot-name
        insertVerbText: cdm-shield-reserve-insert-verb
        ejectVerbText: cdm-shield-reserve-eject-verb
        swap: false
        whitelist:
          components:
          - CdmShieldReserveCartridge
      cdm-shield-reserve-1:
        name: cdm-shield-reserve-slot-name
        insertVerbText: cdm-shield-reserve-insert-verb
        ejectVerbText: cdm-shield-reserve-eject-verb
        swap: false
        whitelist:
          components:
          - CdmShieldReserveCartridge
      cdm-shield-reserve-2:
        name: cdm-shield-reserve-slot-name
        insertVerbText: cdm-shield-reserve-insert-verb
        ejectVerbText: cdm-shield-reserve-eject-verb
        swap: false
        whitelist:
          components:
          - CdmShieldReserveCartridge
      cdm-shield-reserve-3:
        name: cdm-shield-reserve-slot-name
        insertVerbText: cdm-shield-reserve-insert-verb
        ejectVerbText: cdm-shield-reserve-eject-verb
        swap: false
        whitelist:
          components:
          - CdmShieldReserveCartridge
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      cdm-shield-reserve-0: !type:ContainerSlot
      cdm-shield-reserve-1: !type:ContainerSlot
      cdm-shield-reserve-2: !type:ContainerSlot
      cdm-shield-reserve-3: !type:ContainerSlot
  - type: CdmShieldReserve
    maxCartridges: 4
    emergencyShieldFraction: 0.25
  - type: PointLight
    color: "#48C96B"
# Universal States of America corporate shield. It protects only the forward arc selected by generator rotation.
- type: entity
  id: ShieldGeneratorUnsa
  parent: ShieldGeneratorSmall
  name: unsa-directional-shield-generator-name
  description: unsa-directional-shield-generator-description
  components:
  - type: DirectionalShipShieldEmitter
    arcDegrees: 120
  - type: ShipShieldEmitter
    damageLimit: 110000
    healPerSecond: 700
    baseDraw: 30000
    maxDraw: 80000
    shieldColor: "#0A5DFF"
    collisionResistanceMultiplier: 1.0
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Sprite
    sprite: _Exodus/Structures/ShuttleComponents/liberty_shield_generator.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#48C96B"
    - sprite: _Exodus/Structures/ShuttleComponents/liberty_shield_generator.rsi
      state: reserve_0
      map: ["enum.CdmShieldReserveVisualLayers.Cartridges"]
  - type: GenericVisualizer
    snapCardinals: true
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
      enum.CdmShieldReserveVisuals.CartridgeCount:
        enum.CdmShieldReserveVisualLayers.Cartridges:
          0: { state: reserve_0 }
          1: { state: reserve_1 }
  - type: PointLight
    color: "#0A5DFF"
  - type: ItemSlots
    slots:
      cdm-shield-reserve-0:
        name: liberty-shield-reserve-slot-name
        insertVerbText: liberty-shield-reserve-insert-verb
        ejectVerbText: liberty-shield-reserve-eject-verb
        swap: false
        whitelist:
          components:
          - CdmShieldReserveCartridge
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
      cdm-shield-reserve-0: !type:ContainerSlot
  - type: CdmShieldReserve
    maxCartridges: 1
  - type: Machine
    board: ShieldGeneratorUnsaMachineCircuitboard
