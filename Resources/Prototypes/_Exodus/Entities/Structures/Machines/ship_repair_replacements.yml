# Preserve the full machine configuration, including anchoring and faction variants, while restoring no stock.
# Explicit zero amounts override inherited material dictionaries.
- type: entity
  id: PortableGeneratorPacmanShuttleRepaired
  parent: PortableGeneratorPacmanShuttle
  categories: [ HideSpawnMenu ]
  components:
  - type: MaterialStorage
    storage:
      FuelGradePlasma: 0

