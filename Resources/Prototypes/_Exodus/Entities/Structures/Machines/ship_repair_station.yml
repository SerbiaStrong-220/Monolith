- type: entity
  parent: BaseMachine
  id: ShipRepairDroneStation
  name: repair drone station
  description: A self-powered base with five reserved berths for ship repair drones.
  components:
  - type: Sprite
    sprite: _Exodus/Structures/Machines/ship_repair_station.rsi
    layers:
    - state: base
    - state: powered
      shader: unshaded
      map: ["powered"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ShipRepairStationVisuals.Active:
        powered:
          True: { visible: true }
          False: { visible: false }
  - type: ShipRepairStation
  - type: ContainerContainer
    containers:
      repair_drones: !type:Container
  - type: ActivatableUI
    key: enum.ShipRepairStationUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ShipRepairStationUiKey.Key:
        type: ShipRepairStationBoundUserInterface
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [Destruction]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ShipRepairable
    repairTime: 8
    repairCost: 20
