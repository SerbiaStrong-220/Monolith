- type: entity
  id: MachineCrucible
  parent: BaseMachinePowered
  name: ent-MachineCrucible
  description: ent-MachineCrucible.desc
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    layers:
    - sprite: Structures/Storage/Crates/wood.rsi
      state: icon
  - type: Crucible
  - type: EntityStorage
    capacity: 1
    showContents: false
    whitelist:
      tags:
      - CrucibleRecipe
    closeSound:
      path: /Audio/Machines/airlock_close.ogg
    openSound:
      path: /Audio/Machines/airlock_open.ogg

- type: entity
  id: MachineCrucibleConsole
  parent: BaseComputer
  name: ent-MachineCrucibleConsole
  description: ent-MachineCrucibleConsole.desc
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: crucible_red
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: CrucibleConsole
  - type: ActivatableUI
    key: enum.CrucibleConsoleUiKey.Key
    activateSound: /Audio/Machines/machine_switch.ogg # Добавь это!

  - type: UserInterface
    interfaces:
      enum.CrucibleConsoleUiKey.Key:
        type: CrucibleBoundUserInterface
