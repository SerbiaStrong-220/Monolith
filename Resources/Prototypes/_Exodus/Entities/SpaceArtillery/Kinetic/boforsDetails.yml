- type: entity
  id: BaseBoforsTurretPart
  abstract: true
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: CollisionWake
  - type: TileFrictionModifier
    modifier: 1.5
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 1500
        layer:
        - Opaque
        mask:
        - MachineMask
        restitution: 0.3
        friction: 0.2
  - type: Pullable
  - type: Sprite
    sprite: _Exodus/Objects/ShuttleWeapons/bofors/bofors_construction.rsi
    state: bofors_chassis

- type: entity
  id: BaseBoforsTurretPartItem
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _Exodus/Objects/ShuttleWeapons/bofors/bofors_construction.rsi
    state: bofors_chassis
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.2
    sprintModifier: 0.2
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 20
  - type: Item
    size: Ginormous

- type: entity
  id: BoforsChassisUnfinished
  parent: BaseBoforsTurretPart
  name: ent-BoforsChassisUnfinished
  description: ent-BoforsChassisUnfinished.desc
  components:
  - type: Sprite
    sprite: _Exodus/Objects/ShuttleWeapons/bofors/bofors_construction.rsi
    layers:
    - state: bofors_chassis
      map: ["enum.ConstructionVisuals.Layer"]
  - type: Appearance
  - type: Construction
    graph: Bofors
    node: start
    defaultTarget: bofors

- type: entity
  id: BoforsFeedItem
  parent: BaseBoforsTurretPartItem
  name: ent-BoforsFeedItem
  description: ent-BoforsFeedItem.desc
  components:
  - type: Tag
    tags: [BoforsFeedItem]
  - type: Sprite
    sprite: _Exodus/Objects/ShuttleWeapons/bofors/bofors_feed.rsi
    state: bofors_feed

- type: entity
  id: TechDiskBofors
  parent: BaseItem
  name: ent-TechDiskBofors
  description: ent-TechDiskBofors.desc
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Research/researchdisk.rsi
    layers:
    - state: icon
    - state: label
    - state: protect_red
    - state: holo_red
      shader: unshaded
  - type: Tag
    tags: [BoforsDataDisk]

- type: entity
  id: BoforsTargetingItem
  parent: BaseBoforsTurretPartItem
  name: ent-BoforsTargetingItem
  description: ent-BoforsTargetingItem.desc
  components:
  - type: Tag
    tags: [BoforsTargetingItem]
  - type: Sprite
    sprite: _Exodus/Objects/ShuttleWeapons/bofors/bofors_targeting.rsi
    state: bofors_targeting

- type: entity
  id: BoforsBarrelItem
  parent: BaseBoforsTurretPartItem
  name: ent-BoforsBarrelItem
  description: ent-BoforsBarrelItem.desc
  components:
  - type: Tag
    tags: [BoforsBarrelItem]
  - type: Sprite
    sprite: _Exodus/Objects/ShuttleWeapons/bofors/bofors_barrel.rsi
    state: bofors_barrel

- type: entity
  id: BoforsWorkPiece
  parent: BaseBoforsTurretPart
  name: ent-BoforsWorkPiece
  description: ent-BoforsWorkPiece.desc
  components:
  - type: Sprite
    state: bofors_workpiece
  - type: CrucibleRecipe
    processingTime: 25
    resultEntity: BoforsFlatpack
  - type: Tag
    tags: [CrucibleRecipe]

