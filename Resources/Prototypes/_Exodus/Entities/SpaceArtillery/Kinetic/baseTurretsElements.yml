- type: entity
  id: BaseTurretPart
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _NF/Objects/Specific/Research/rped.rsi
    state: icon
  - type: MultiHandedItem
  - type: HeldSpeedModifier
    walkModifier: 0.2
    sprintModifier: 0.2
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    damage:
      types:
        Blunt: 20

