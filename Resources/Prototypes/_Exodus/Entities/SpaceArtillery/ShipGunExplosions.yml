# Exodus: self-destruct explosion for ship guns.
# When a gun reaches its destruction damage threshold, it triggers a powerful
# explosion before being removed.
#
# Each entity below replaces a BallisticArtilleryTierXHP parent in a gun's prototype.
# Pattern: replace `- BallisticArtilleryTierXHP` with `- ShipGunTierXHpExplodes3x3`
# (or `5x5`). This keeps the HP thresholds identical to the original tier,
# but adds an Explosive component and an ExplodeBehavior to the destruction threshold.
#
# Two sizes:
#   3x3 - radius 2
#   5x5 - radius ~3.5
# Both use the ShipGunSelfDestruct explosion (Structural: 50) which breaks
# reinforced plastitanium walls and most objects within the blast radius.

# ----- Tier 1 (basic, reinforced wall level) -----

- type: entity
  id: ShipGunTier1HpExplodes3x3
  abstract: true
  suffix: T1
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: WallDefense1
  - type: Explosive
    explosionType: ShipGunSelfDestruct
    totalIntensity: 200
    intensitySlope: 25
    maxIntensity: 50
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 4000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior
    - trigger:
        !type:DamageTrigger
        damage: 3500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:ExplodeBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

