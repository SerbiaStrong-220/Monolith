# Dragon-egg pokeball - reused existing asset.
- type: entity
  id: DragonEggPet
  parent: BaseExodusPetCapsule
  name: dragon egg
  description: It stirs with a bound hatchling. Crack it to call your dragon forth.
  components:
  - type: PetCapsule
    pet: MobDragonPetCompanion
  - type: Sprite
    sprite: _NF/Objects/Consumable/Food/dragon_egg.rsi
    state: icon
  - type: Item
    size: Small
    sprite: _NF/Objects/Consumable/Food/dragon_egg.rsi
    heldPrefix: null

