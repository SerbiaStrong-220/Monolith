- type: entity
  parent: WeaponPistolMk58
  id: WeaponPistolMaco
  name: maco-licensed-pistol-name
  description: maco-licensed-pistol-description
  components:
  - type: SafetyDepositRestricted
  - type: Sprite
    sprite: _Exodus/Objects/Weapons/Guns/Pistols/maco.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
    - map: ["gripAttachment"]
    - map: ["barrelAttachment"]
      offset: 0.5620, 0
  - type: Clothing
    sprite: _Exodus/Objects/Weapons/Guns/Pistols/maco.rsi
  - type: Gun
    damageModifier: 1.5
  - type: OnUseTimerTrigger
    delay: 3.5
    useVerbInstead: true
    beepSound:
      path: /Audio/Effects/beep1.ogg
      params:
        volume: 5
    initialBeepDelay: 0
    beepInterval: 2
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 120
    canCreateVacuum: false
