- type: entity
  parent: BaseItem
  id: SpaceLeviathanChitin
  name: leviathan chitin
  description: A fragment of an unusually durable shell. It has no practical use yet.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Specific/Xeno/xeno_materials.rsi
    state: chitin-chunk
  - type: Item
    size: Small

- type: entity
  parent: PuddleTemporary
  id: PuddleIchorLeviathan
  suffix: Ichor
  categories: [ HideSpawnMenu ]
  components:
  - type: SolutionContainerManager
    solutions:
      puddle:
        maxVol: 1000
        reagents:
        - ReagentId: Ichor
          Quantity: 50
  - type: TimedDespawn
    lifetime: 30

- type: entity
