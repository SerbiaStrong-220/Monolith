- type: entity
  parent: BaseItem
  id: MedicalTrackingTablet
  name: medical rescue tablet
  description: Shows medical clients' last known body positions and condition on the bluespace map.
  components:
  - type: MedicalTrackingTablet
    updateInterval: 1
    openSound:
      path: /Audio/_Exodus/Items/MedicalTablet/open.ogg
      params:
        volume: -6
    closeSound:
      path: /Audio/_Exodus/Items/MedicalTablet/close.ogg
      params:
        volume: -6
    alertCooldown: 3
    alertSounds:
      Critical:
        path: /Audio/_Exodus/Items/MedicalTablet/critical.ogg
        params:
          volume: -4
          maxDistance: 5
      Dead:
        path: /Audio/_Exodus/Items/MedicalTablet/death.ogg
        params:
          volume: -4
          maxDistance: 5
  - type: Item
    size: Small
    # Empty layers disable automatic in-hand states from the item's Sprite RSI.
    inhandVisuals:
      left: []
      middle: []
      right: []
  - type: Sprite
    sprite: _Exodus/Objects/Devices/medical_tracking_tablet.rsi
    state: tablet
  - type: Icon
    sprite: _Exodus/Objects/Devices/medical_tracking_tablet.rsi
    state: icon
  - type: RadarConsole
    followEntity: true
    noRotate: true
    hideCoords: false
    maxIffRange: null
  - type: ActivatableUI
    key: enum.MedicalTrackingUiKey.Key
    blockSpectators: true
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["Medical"]]
  - type: UserInterface
    interfaces:
      enum.MedicalTrackingUiKey.Key:
        type: MedicalTrackingBoundUserInterface
  - type: StaticPrice
    price: 500
