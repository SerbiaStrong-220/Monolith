- type: entity
  parent: BaseShipLPC
  id: ShipVoucherLadya
  name: TSF ladya LPC
  description: A small card that contains the data for the procurement of a Ladya-class supporter from the flagship's reserves.
  components:
  - type: Sprite
    layers:
    - state: icon_capital
    - state: screen
      color: "#05ffff"
    - state: screen4
      color: "#05ffff"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Security
    companyName: TSF
    vessels:
    - Ladya
  - type: StaticPrice
    vendPrice: 200000

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherFerz
  name: PDV ferz LPC
  description: A small card that authorizes the procurement of a Ferz.
  components:
  - type: Sprite
    layers:
    - state: icon_capital
    - state: screen
      color: "#1eff00"
    - state: screen5
      color: "#1eff00"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: BlackMarket
    companyName: PDV
    vessels:
    - Ferz
  - type: StaticPrice
    vendPrice: 325000

# start T3 TSF

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherAlcore
  name: TSF Alcore LPC
  description: A small card containing the data required to requisition an Alcor-class cruiser from the flagships reserves.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpcnew.rsi
    layers:
    - state: icon_capital
    - state: screen
      color: "#05ffff"
    - state: screen3
      color: "#05ffff"
      shader: unshaded
  - type: ShipyardVoucher
    destroyOnEmpty: false
    cooldown: 10800 # hour and 25 minutes
    consoleType: Security
    companyName: TSF
    vessels:
    - Alcore
  - type: StaticPrice
    vendPrice: 800000

# end T3 TSF
