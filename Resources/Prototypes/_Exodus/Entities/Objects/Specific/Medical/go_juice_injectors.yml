- type: entity
  abstract: true
  parent: ChemicalMedipen
  id: BaseGoJuiceAutoInjector
  components:
  - type: Item
    sprite: Objects/Specific/Chemistry/syringe.rsi
  - type: Tag
    tags: []

- type: entity
  parent: BaseGoJuiceAutoInjector
  id: GoJuiceAutoInjector15
  name: go-juice microinjector (15 units)
  description: A single-use injector containing 15 units of go-juice. Injects the entire dose.
  components:
  - type: Sprite
    layers:
    - state: microstimpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    emptySpriteName: microstimpen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: GoJuice
          Quantity: 15
  - type: Hypospray
    transferAmount: 15
  - type: StaticPrice
    vendPrice: 2500000

