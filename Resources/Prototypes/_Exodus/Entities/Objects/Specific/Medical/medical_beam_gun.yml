- type: entity
  parent: [BaseItem, PowerCellSlotMediumItem]
  id: MedicalBeamGun
  name: medigun
  description: A powered medical projector that treats injuries and closes bleeding wounds while its beam remains on the patient. Does not replenish blood.
  components:
  - type: SafetyDepositRestricted
  - type: Sprite
    sprite: _Exodus/Objects/Specific/Medical/medical_beam_gun.rsi
    state: icon
  - type: Item
    size: Large
    sprite: _Exodus/Objects/Specific/Medical/medical_beam_gun.rsi
  - type: Clothing
    sprite: _Exodus/Objects/Specific/Medical/medical_beam_gun.rsi
    quickEquip: false
    slots:
    - Belt
    - suitStorage
  - type: Appearance
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        whitelist:
          sizes:
          - Tiny
          - Small
        blacklist:
          tags:
          - PowerCage
        whitelistFailPopup: medical-beam-gun-cell-size
  - type: MedicalBeamGun
    range: 10
    collisionMask: Opaque
    healInterval: 0.2
    inputTimeout: 0.6
    chargePerSecond: 36
    automaticRateDivisor: 3
    bleedReductionPerSecond: 1
    beamStyle: MedicalHealingBeam
    healingSound:
      path: /Audio/_Exodus/Items/MedicalBeam/healing_loop.ogg
      params:
        volume: -8
        maxDistance: 12
    startSound:
      path: /Audio/_Exodus/Items/MedicalBeam/beam_start.ogg
      params:
        volume: -6
        maxDistance: 10
    stopSound:
      path: /Audio/_Exodus/Items/MedicalBeam/beam_stop.ogg
      params:
        volume: -8
        maxDistance: 10
    modeSound:
      path: /Audio/_Exodus/Items/MedicalBeam/mode_switch.ogg
      params:
        volume: -6
        maxDistance: 5
    targetWhitelist:
      components:
      - HumanoidAppearance
    groupHealing:
      Brute: 5
      Burn: 5
    typeHealing:
      Asphyxiation: 5
  - type: StaticPrice
    price: 1500

- type: entityLinkVisual
  id: MedicalHealingBeam
  color: "#70ffc4"
  outerHalfWidth: 0.1
  innerHalfWidth: 0.025
  outerAlpha: 0.25
  innerAlpha: 0.9
