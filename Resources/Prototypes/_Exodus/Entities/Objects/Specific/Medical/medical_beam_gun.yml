- type: entity
  parent: [BaseItem, PowerCellSlotMediumItem]
  id: MedicalBeamGun
  name: medigun
  description: A powered medical projector that treats a patient while its beam remains on them. Does not replenish blood or stop bleeding.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/advancedlasergun.rsi
    state: icon
    color: "#a5ffd6"
  - type: Item
    size: Large
    sprite: Objects/Weapons/Guns/Battery/advancedlasergun.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/advancedlasergun.rsi
    quickEquip: false
    slots:
    - Belt
    - suitStorage
  - type: Appearance
  - type: MedicalBeamGun
    range: 6
    healInterval: 0.2
    inputTimeout: 0.6
    chargePerSecond: 12
    beamStyle: MedicalHealingBeam
    targetWhitelist:
      components:
      - HumanoidAppearance
    groupHealing:
      Brute: 5
      Burn: 5
    typeHealing:
      Asphyxiation: 5
  - type: StaticPrice
    price: 1500

- type: entityLinkVisual
  id: MedicalHealingBeam
  color: "#70ffc4"
  outerHalfWidth: 0.1
  innerHalfWidth: 0.025
  outerAlpha: 0.25
  innerAlpha: 0.9
