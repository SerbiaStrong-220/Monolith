- type: entity
  id: BorgModuleMalfSRD
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: hacked ship repair cyborg module
  description: A module with a regenerating ship repair device for malfunctioning drone vessels and a self-recharging RCD.
  components:
  - type: Sprite
    layers:
    - state: engineering
    - state: icon-rcd
  - type: ItemBorgModule
    moduleId: ShipRepair
    items:
    - ShipRepairDeviceMalf
    - RCDRecharging
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: rcd-module }

- type: entity
  id: BorgModuleMalfEsword
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: hacked double energy sword cyborg module
  description: A module with a double energy sword adapted for malfunctioning drone cyborgs.
  components:
  - type: Sprite
    layers:
    - state: syndicate
    - state: icon-syndicate
  - type: ItemBorgModule
    moduleId: EnergySword
    items:
    - CyborgEnergySwordDouble
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: syndicate-esword-module }

- type: entity
  id: BorgModuleMalfWeapon
  parent: [ BaseBorgModule, BaseProviderBorgModule ]
  name: hacked heavy weapon cyborg module
  description: A module with one-handed Anubis and Ratel weapons that regenerate their own ammunition.
  components:
  - type: Sprite
    layers:
    - state: syndicate
    - state: icon-syndicate
  - type: ItemBorgModule
    moduleId: Security
    items:
    - CyborgWeaponMalfAnubis
    - CyborgWeaponMalfRatel
  - type: BorgModuleIcon
    icon: { sprite: Interface/Actions/actions_borg.rsi, state: syndicate-weapon-module }
