- type: entity
  id: BaseADSShuttleEmergencyBeacon
  parent: BaseItem
  abstract: true
  name: emergency shuttle beacon
  description: A disposable emergency beacon tuned to summon a specific ADS vessel.
  components:
  - type: Sprite
    sprite: _Exodus/Objects/Consumable/Beacons/little_beacon.rsi
    layers:
    - state: beacon
  - type: Item
    size: Small
    sprite: _Exodus/Objects/Consumable/Beacons/little_beacon.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: ShuttleEventBeacon
  - type: Tag
    tags:
    - Payload

- type: entity
  id: BaseADSShuttleEmergencyBeaconTier1
  parent: BaseADSShuttleEmergencyBeacon
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: beacon
    - state: emission_tier1
      shader: unshaded

