- type: entity
  id: SpaceLeviathan
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat, ShowMedicalIcons ]
  name: space leviathan
  description: When the space becomes too quiet, there is no hope, there is no escape, but there is this.
  suffix: no despawn
  components:
  - type: Damageable
    damageModifierSet: Leviathan
    damageContainer: Biological
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      groups:
        Brute: -25
        Burn: -25
        Toxin: -25
      types:
        Bloodloss: -3
  - type: Bloodstream
    bloodMaxVolume: 1000
    bloodRefreshAmount: 100
  - type: LanguageKnowledge
    speaks:
    - Leviathan
    understands:
    - Leviathan
  - type: CollectiveMind
    channels:
    - Leviathan
    defaultChannel: Leviathan
  - type: RadialDamageFieldTarget
    profiles:
    - Leviathan
  - type: GhostRole
    allowMovement: true
    allowSpeech: true
    makeSentient: true
    name: ghost-role-information-space-leviathan-name
    description: ghost-role-information-space-leviathan-description
    rules: ghost-role-information-space-leviathan-rules
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 36000 # 10 hrs
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
    raffle:
      settings: default
  - type: GhostTakeoverAvailable
  - type: WorldChunkLoadingExempt
  - type: CleanupImmune
  - type: PointLight
    color: "#FF8227FF"
    radius: 3
    energy: 3
  - type: TailedEntity
    amount: 65
    spacing: 1
    prototype: SpaceWhaleSegment
  - type: MovementSpeedModifier
    baseSprintSpeed: 70
    baseWalkSpeed: 70
  - type: Eye
    pvsScale: 4.458052
  - type: ContentEye
    targetZoom: 4.458052, 4.458052
    maxZoom: 4.458052, 4.458052
  - type: TemporarySpeedBoost
    action: ActionLeviathanSurge
    duration: 10
    walkSpeedMultiplier: 3
    sprintSpeedMultiplier: 3
    weightlessSpeedMultiplier: 3
    weightlessAccelerationMultiplier: 3
  - type: RadarBlip
    scale: 3
    shape: hexagon
    visibleFromOtherGrids: true
  - type: ShipNpcTarget
    needGrid: NoGrid
    priority: 1
    factionCoresOnly: true
  - type: BluespaceMapBlip
    shape: Ring
    color: "#FF8227"
    scale: 1.5
    label: bluespace-map-blip-space-leviathan
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
      enum.ReadOnlyBluespaceMapUiKey.Key:
        type: ReadOnlyBluespaceMapBoundUserInterface
  - type: IntrinsicUI
    uis:
      enum.RadarConsoleUiKey.Key:
        toggleAction: ActionLeviathanShowRadar
      enum.ReadOnlyBluespaceMapUiKey.Key:
        toggleAction: ActionShowBluespaceMap
  - type: RadarConsole
    followEntity: true
    noRotate: true
    hideCoords: false # Frontier
    maxIffRange: null # Frontier
  - type: MovementIgnoreGravity
    gravityState: true
  - type: WarpPoint
    follow: true
    location: space leviathan
  - type: HTN
    sleepPlayerCheckRangeOverride: 1000
    blackboard:
      VisionRadius: !type:Single
        500
      AggroVisionRadius: !type:Single
        1000
      RotateSpeed: !type:Single
        3.141
    rootTask:
      task: LeviathanCompound
  - type: NpcFactionMember
    factions:
    - Dragon
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 2
        density: 137992
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MeleeWeapon
    altDisarm: false
    attackRate: 0.3
    range: 8
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Blunt: 500
        Slash: 250
        Structural: 3000
  - type: Speech
    speechVerb: LargeMob
  - type: TTS
    voice: dragon_knight_dragon_dota_2
  - type: InteractionPopup
    interactSuccessString: petting-success-leviathan
    interactFailureString: petting-failure-leviathan
    interactFailureSound:
      path: /Audio/Effects/bite.ogg
  - type: Sprite
    sprite: _Exodus/Mobs/Monolith/leviathan.rsi
    state: head
    noRot: false
  - type: NightVision # Goobstation - Nigthvision
    color: "#808080"
    activateSound: null
    deactivateSound: null
  - type: AmbientSound
    enabled: true
    volume: 1
    range: 50
    sound:
      path: /Audio/_Exodus/Ambience/Leviathan/leviathan-ambient.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      16000: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 16000
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SpaceLeviathanCorpse:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Tag
    tags:
    - SpaceLeviathan
  - type: DamageContacts
    damage:
      types:
        Structural: 4000
        Blunt: 10
    ignoreWhitelist:
      tags:
      - SpaceLeviathan

- type: entity
  id: SpaceWhaleSegment
  parent:
  - FlyingMobBase
  suffix: do not spawn
  components:
  - type: CleanupImmune
  - type: Damageable
    damageModifierSet: Leviathan
    damageContainer: Biological
  - type: PointLight
    color: "#FF8227FF"
    radius: 3
    energy: 1
  - type: RadarBlip
    scale: 2
    shape: diamond
    visibleFromOtherGrids: true
  - type: Sprite
    sprite: _Exodus/Mobs/Monolith/leviathan.rsi
    state: segment
    noRot: false
  - type: Tag
    tags:
    - SpaceLeviathan
    - HideContextMenu
  - type: Physics
    bodyType: KinematicController
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 2
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: DamageContacts
    damage:
      types:
        Structural: 2000
        Blunt: 10
    ignoreWhitelist:
      tags:
      - SpaceLeviathan

- type: entity
  id: SpaceLeviathanCorpse
  name: space leviathan corpse
  description: A massive segment of a slain space leviathan. Its shell is still valuable.
  components:
  - type: CleanupImmune
  - type: Sprite
    sprite: _Exodus/Mobs/Monolith/leviathan.rsi
    state: segment
    noRot: false
  - type: RadarBlip
    scale: 3
    shape: diamond
    visibleFromOtherGrids: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Dynamic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1,-1,1,1"
        density: 137992
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Pullable
  - type: StaticPrice
    price: 0
  - type: Butcherable
    butcherDelay: 20
    spawned:
    - id: PuddleIchorLeviathan
      amount: 4
    - id: SpaceLeviathanChitin
      amount: 1
      maxAmount: 4
    - id: SpaceLeviathanOreSpawner
      amount: 24
    - id: ClothingBackpackDroneLootT22
      amount: 4
    - id: ClothingBackpackFleetLootT1
      amount: 1
      maxAmount: 4
    - id: ClothingHeadHatLeviathanChitinCrown
      prob: 0.2
    - id: ClothingHandsGlovesLeviathanChitin
      prob: 0.2
    - id: GunneryServerSuperFlatpack
      prob: 0.2
    - id: EffectLeviathanButcherSound

- type: entity
  id: EffectLeviathanButcherSound
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 1
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/_Exodus/Ambience/Leviathan/leviathan-appear.ogg
    positional: true

- type: entity
  id: SpaceLeviathanDespawn
  parent: SpaceLeviathan
  suffix: legacy no despawn
- type: entity
  id: SpaceLeviathanSpawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
    - sprite: _Exodus/Mobs/Monolith/leviathan.rsi
      state: head
    - state: green
    - state: ai
  - type: ConditionalSpawner
    prototypes:
    - SpaceLeviathan
