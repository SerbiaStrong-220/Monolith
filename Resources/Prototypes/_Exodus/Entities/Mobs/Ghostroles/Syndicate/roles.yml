- type: startingGear
  id: SyndicateGhostOperativeGear
  equipment:
    jumpsuit: ClothingUniformJumpsuitOperative
    back: ClothingBackpackDuffelSyndicate
    mask: ClothingMaskGasSyndicate
    eyes: ClothingEyesHudSyndicate
    ears: ClothingHeadsetAltSyndicate
    gloves: ClothingHandsGlovesCombat
    outerClothing: ClothingOuterHardsuitSyndie
    shoes: ClothingShoesBootsMagSyndie
    id: SyndiPDA
    pocket2: WeaponPistolAnaconda
    belt: ClothingBeltMilitaryWebbing
  inhand:
  - ClothingBackpackDuffelSyndicateFilledWSPR
  storage:
    back:
    - Telecrystal50
    - Telecrystal50
    - Telecrystal50
    - Telecrystal50
    - PinpointerSyndicatePOI
    - MicroBombImplanter
    - DoubleEmergencyOxygenTankFilled
    - MedkitCombatFilled
    - SyringeCaseAltFilled
    - JetpackMiniFilled
    belt:
    - HandHeldMassScannerBorg
    - SyndicateJawsOfLife

- type: randomHumanoidSettings
  id: SyndicateGhostOperative
  parent: EventHumanoid
  randomizeName: false
  speciesBlacklist:
  - Vox
  - Asakim
  components:
  - type: GhostRole
    name: ghost-role-information-syndicate-operative-name
    description: ghost-role-information-syndicate-operative-description
    rules: ghost-role-information-syndicate-operative-rules
    mindRoles:
    - MindRoleGhostRoleNeutral
    - MindRoleNukeops
    raffle:
      settings: default
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 54000 # 15 hrs
  - type: Loadout
    prototypes: [ SyndicateGhostOperativeGear ]
    roleLoadout: [ RoleSurvivalNukie ]
  - type: AutoImplant
    implants:
    - UplinkImplant
    - FreedomImplant
  - type: RandomMetadata
    nameSegments:
    - nukeops-role-operator
    - SyndicateNamesNormal
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: NukeOperative

- type: randomHumanoidSettings
