    name: ghost-role-information-syndicate-leader-name
    description: ghost-role-information-syndicate-leader-description
    rules: ghost-role-information-syndicate-leader-rules
    mindRoles:
    - MindRoleGhostRoleNeutral
    - MindRoleNukeopsCommander
    raffle:
      settings: default
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 90000 # 25 hrs
  - type: RandomMetadata
    nameSegments:
    - random-metadata-name-syndicate-leader
    - NamesLastMilitary

- type: randomHumanoidSettings
  id: SyndicateGhostLeaderNoTimelock
  parent: SyndicateGhostLeader
