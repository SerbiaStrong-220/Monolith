- type: startingGear
  id: SyndicateGhostOperativeGear
  parent: SyndicateOperativeGearFullNoUplink
  equipment:
    id: SyndicateIDCard

- type: randomHumanoidSettings
  id: SyndicateGhostOperative
  parent: EventHumanoid
  randomizeName: false
  speciesBlacklist:
  - Vox
  - Asakim
  components:
  - type: GhostRole
    name: ghost-role-information-syndicate-operative-name
    description: ghost-role-information-syndicate-operative-description
    rules: ghost-role-information-syndicate-operative-rules
    mindRoles:
    - MindRoleGhostRoleNeutral
    - MindRoleNukeops
    raffle:
      settings: default
    requirements:
    - !type:OverallPlaytimeRequirement
      time: 54000 # 15 hrs
  - type: Loadout
    prototypes: [ SyndicateGhostOperativeGear ]
    roleLoadout: [ RoleSurvivalNukie ]
  - type: AutoImplant
    implants:
    - UplinkImplant
    - FreedomImplant
    - MicroBombImplant
  - type: RandomMetadata
    nameSegments:
    - nukeops-role-operator
    - SyndicateNamesNormal
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: NukeOperative

- type: randomHumanoidSettings
  id: SyndicateGhostOperativeNoTimelock
  parent: SyndicateGhostOperative
  components:
  - type: GhostRole
    name: ghost-role-information-syndicate-operative-name
    description: ghost-role-information-syndicate-operative-description
    rules: ghost-role-information-syndicate-operative-rules
    mindRoles:
    - MindRoleGhostRoleNeutral
    - MindRoleNukeops
    raffle:
      settings: default
    requirements: []

- type: randomHumanoidSettings
  id: SyndicateGhostLeader
  parent: SyndicateGhostOperative
