    - !type:OverallPlaytimeRequirement
      time: 18000 # 5 hrs
  - type: GhostTakeoverAvailable
  - type: Loadout
    prototypes: [ LimitedPassengerGear ]
    roleLoadout: [ RoleSurvivalStandard ]
