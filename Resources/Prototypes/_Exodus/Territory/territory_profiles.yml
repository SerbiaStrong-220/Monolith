# Shared territory profiles for POI grids.
# GridTerritory maps only mark that a grid has territory.
# Radius/color behavior is selected here by game map / station id.

- type: territoryProfile
  id: PoiSmall
  radius: 1000
  biomeSourcePrototype: BiomeSourceTerritoryMiddle
  colorPoiByFaction: true
  neutralPoiColor: "#A6A6A6"
  gameMapPrototypes:
  - AnomalousLab
  - Sevastopol
  - TSFMCOutpost
  - Bahama
  - CaseysCasino
  - CargoDepot
  - CargoDepotAlt
  - Edison
  - Grifty
  - McHobo
  - Omnichurch
  - ThePit
  - Tinnia

- type: territoryProfile
  id: PoiMedium
  default: true
  radius: 2500
  biomeSourcePrototype: BiomeSourceTerritoryMiddle
