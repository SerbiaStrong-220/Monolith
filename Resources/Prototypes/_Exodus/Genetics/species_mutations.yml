- type: geneticMutation
  id: GeneticGrowingClaws
  name: genetics-gene-growing-claws
  description: genetics-gene-growing-claws-desc
  activationMessage: genetics-feeling-growing-claws
  instability: 10
  modifiers:
    unarmedDamage:
      types:
        Blunt: 3
  preserveComponents: [Claws]
  components:
  - type: Claws
    clawStage: ReptilianTinyClaws
    clawGrowthNotification: claws-growth
    claws:
      -1: ReptilianDeclawed
      0: ReptilianTinyClaws
      1: ReptilianSmallClaws
      2: ReptilianMediumClaws
      3: ReptilianBigClaws
      4: ReptilianHugeClaws

- type: geneticMutation
  id: GeneticColdDependence
  name: genetics-gene-cold-dependence
  description: genetics-gene-cold-dependence-desc
  activationMessage: genetics-feeling-cold-dependence
  instability: -5
  conflicts: [GeneticColdResistance, GeneticCryostasis, GeneticFur]
  modifiers:
    damageModifiers:
      coefficients:
        Cold: 1.3
  thermal:
    coldThresholdOffset: 25
    coldDamageMultiplier: 1.5
  components:
  - type: TemperatureSpeed
    thresholds:
      298: 0.8
      292: 0.6
      285: 0.4
  - type: ThermalRegulator
    implicitHeatRegulation: 320
    metabolismHeat: 230
    radiatedHeat: 710
    shiveringHeatRegulation: 690
    sweatHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
    updateInterval: 2
  temperatureEffects:
  - maximumTemperature: 295
    effects:
    - !type:Drunk
      boozePower: 1
  - maximumTemperature: 285
    effects:
    - !type:GenericStatusEffect
      key: Drowsiness
      component: Drowsiness
      time: 2
      type: Add
      refresh: true

