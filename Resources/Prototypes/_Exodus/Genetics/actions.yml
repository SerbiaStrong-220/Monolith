- type: entity
  id: ActionGeneticTelekinesis
  categories: [HideSpawnMenu]
  components:
  - type: ActionTargetingCursor
  - type: EntityTargetAction
    icon: { sprite: Objects/Magic/magicactions.rsi, state: blink }
    useDelay: 1
    range: 10
    checkCanAccess: true
    canTargetSelf: false
    blacklist:
      components:
      - MobState
    event: !type:GeneticTelekinesisEvent

