- type: entity
  id: BaseStationCargoMarket
  abstract: true
  components:
  - type: CargoMarketData
    whitelist:
      tags:
      - Ore
      - Sheet
      - Metal
      - Ingot
      - PointDisk #Mono start
      - Brutepack
      - Ointment
      - Bloodpack #Mono end
      - RawMaterial
      - CrystalRed
      - CrystalGreen
      - CrystalPink
      - CrystalOrange
      - CrystalBlue
      - CrystalCyan
      components:
      - Material
      - ConstructionMaterials
      - ToolRefinable
      - MachinePart
      - VendingMachineRestock
      - Seed
      - MachineBoard
      - ComputerBoard
    blacklist:
      tags:
      - Trash
      - Mail
      - Paper
      components:
      - Anchorable # Exodus: structures use the additional stock rule below.
      - Food
      - Currency # No selling money.
      - SpaceGarbage
      - Contraband
      - Gun
      - Ammo
      - Drink
      - GasTank # Default containers won't be empty
      - Explosive
      - Actor
      - Mind # Players
      - MindContainer # Positronic brains
      - Body # No corpses
      - MobPrice # Animals (live or dead) and the like
      - XenoArtifact # Exodus: current artifact component; unique, abusable for research points.
      - RCD # Dup charges
      - Storage # Till fixed
      - StorageFill # Till fixed
    whitelistOverride:
      components:
      - UraniumMaterials # Counts as food
    # Exodus-begin: structures may be explosive machinery, but retain the other stock exclusions.
    additionalStockRules:
    - whitelist:
        components:
        - Anchorable
      blacklist:
        tags:
        - Trash
        - Mail
        - Paper
        components:
        - Food
        - Currency
        - SpaceGarbage
        - Contraband
        - Gun
        - Ammo
        - Drink
        - GasTank
        - Actor
        - Mind
        - MindContainer
        - Body
        - MobPrice
        - XenoArtifact
        - RCD
        - Storage
        - StorageFill
    # Exodus: explicitly saleable autonomous mobs may have an empty MindContainer.
    - whitelist:
        components:
        - CargoSellableMob
      blacklist:
        tags:
        - Trash
        - Mail
        - Paper
        components:
        - Food
        - Currency
        - SpaceGarbage
        - Contraband
        - Gun
        - Ammo
        - Drink
        - GasTank
        - Actor
        - Mind
        - Body
        - MobPrice
        - XenoArtifact
        - RCD
        - Storage
        - StorageFill
    # Exodus-end

- type: entity
