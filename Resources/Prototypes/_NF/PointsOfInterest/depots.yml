# Notes:
# Basic Cargo Depot selling point for economy and great wealth
- type: pointOfInterest
  id: CargoDepot
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Грузовое Депо' # Ru-Localization
  # # Exodus start - even stronger spread (1km radius, 4x circular placement)
  minimumDistance: 11500
  maximumDistance: 15500
  # # Exodus end
  spawnGroup: CargoDepot
  gridPath: /Maps/_NF/POI/cargodepot.yml
  addComponents: &cargoComponents
  - type: IFF
    color: "#37C837"
  - type: ProtectedGrid
    preventArtifactTriggers: true
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true
  - type: WorldGenDistanceCarver
    distanceThresholds:
      # Dead zone
      - maxDistance: 500
        prob: 0.0
      - maxDistance: 1000
        prob: 0.3
  - type: Tower7G # Exodus-Adminbus
    range: 256

- type: pointOfInterest
  id: CargoDepotAlt
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Грузовое Депо' # Ru-Localization
  # # Exodus start - even stronger spread (1km radius, 4x circular placement)
  minimumDistance: 11500
  maximumDistance: 15500
  # # Exodus end
  spawnGroup: CargoDepot
  gridPath: /Maps/_NF/POI/cargodepotalt.yml
  addComponents: *cargoComponents

- type: gameMap
  id: CargoDepot
  mapName: 'Cargo Depot' # Has a letter appended in PointOfInterestSystem
  mapPath: /Maps/_NF/POI/cargodepotalt.yml
  minPlayers: 0
  stations:
    CargoDepot:
      stationProto: StandardFrontierOutpost
      # # Exodus start - Territory for Cargo Depot (1km)
      gridComponents:
      - type: GridTerritory
        radius: 1000
      # # Exodus end
      components: &cargoStationComponents
        - type: StationNameSetup
          mapNameTemplate: 'Грузовое Депо' # Ru-Localization # Has a letter appended in PointOfInterestSystem
        - type: TradeCrateDestination
          destinationProto: CargoA # Redefined in PointOfInterestSystem

- type: gameMap
  id: CargoDepotAlt
  mapName: 'Грузовое Депо' # Ru-Localization # Has a letter appended in PointOfInterestSystem
  mapPath: /Maps/_NF/POI/cargodepotalt.yml
  minPlayers: 0
  stations:
    CargoDepotAlt:
      stationProto: StandardFrontierOutpost
      # # Exodus start - Territory for Cargo Depot Alt (1km)
      gridComponents:
      - type: GridTerritory
        radius: 1000
      # # Exodus end
      components: *cargoStationComponents
