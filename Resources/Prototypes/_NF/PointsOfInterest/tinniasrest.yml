# Notes:
# Down at your local saloon
- type: pointOfInterest
  id: Tinnia
  parent: [BasePOI, BaseRepairablePOI]
  name: "Ресторан Тинни" # Ru-Localization
  # # Exodus start - even stronger spread (1km radius)
  minimumDistance: 6000
  maximumDistance: 9000
  # # Exodus end
  spawnGroup: RestStop
  gridPath: /Maps/_NF/POI/tinnia.yml
  addComponents:
  - type: StationTransit
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true
  - type: Tower7G # Exodus-Adminbus
    range: 256

- type: gameMap
  id: Tinnia
  mapName: "Ресторан Тинни" # Ru-Localization
  mapPath: /Maps/_NF/POI/tinnia.yml
  minPlayers: 0
  stations:
    Tinnia:
      stationProto: DeadDropFrontierOutpost
      # # Exodus start - Territory for Tinnia's Restaurant (1km)
      gridComponents:
      - type: GridTerritory
        radius: 1000
      # # Exodus end
      components:
        - type: StationNameSetup
          mapNameTemplate: "Ресторан Тинни" # Ru-Localization
