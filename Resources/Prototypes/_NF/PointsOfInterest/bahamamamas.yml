# Notes:
# I want to lie, shipwrecked and comatose, drinking fresh mango juice.
- type: pointOfInterest
  id: Bahama
  parent: [BasePOI, BaseRepairablePOI]
  name: 'Багамская Мама' # Ru-Localization
  # Exodus start - even stronger spread (1km radius)
  minimumDistance: 6000
  maximumDistance: 9000
  # Exodus end
  spawnGroup: RestStop
  gridPath: /Maps/_NF/POI/bahama.yml
  addComponents:
  - type: StationTransit
  - type: SolarPoweredGrid
    trackOnInit: true
    doNotCull: true

- type: gameMap
  id: Bahama
  mapName: 'Багамская Мама' # Ru-Localization
  mapPath: /Maps/_NF/POI/bahama.yml
  minPlayers: 0
  stations:
    Bahama:
      stationProto: DeadDropFrontierOutpost
      # Exodus start - Territory for Bahama Mama / Багамская Мама (1km)
      gridComponents:
      - type: GridTerritory
        radius: 1000
      # Exodus end
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Багамская Мама' # Ru-Localization
