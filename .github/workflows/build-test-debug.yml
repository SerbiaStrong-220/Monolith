name: Build & Test Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

jobs:
  build:
    if: github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /p:WarningsAsErrors=nullable /m

    - name: Run Content.Tests
      shell: pwsh
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Run Content.IntegrationTests
      shell: pwsh
      # Exodus-begin: keep console output concise and save detailed test/hang diagnostics as artifacts.
      env:
        DOTNET_gcServer: '1'
      # Exodus: temporarily exclude genetics tests while diagnosing integration test hangs.
      # Exodus: use one NUnit worker to reduce concurrent integration-test load.
      # Exodus: above 2000 selected tests the adapter otherwise runs the whole assembly, bypassing exclusions.
      run: >-
        dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj
        --filter "FullyQualifiedName!~ShipyardTest&FullyQualifiedName!~Content.IntegrationTests.Tests._Exodus.Genetic"
        --logger "console;verbosity=minimal"
        --logger "trx;LogFileName=integration-tests.trx"
        --results-directory "$(pwd)/test_results/integration"
        --blame-hang-timeout 10m --blame-hang-dump-type mini
        -- NUnit.ConsoleOut=0 NUnit.MapWarningTo=Failed NUnit.NumberOfTestWorkers=1
        NUnit.AssemblySelectLimit=100000
        NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"
      # Exodus-end

    - name: Archive NUnit3 test results.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nunit3-results-${{ matrix.os }}
        path: test_results/*
        retention-days: 7
        compression-level: 9
  ci-success:
    name: Build & Test Debug
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
