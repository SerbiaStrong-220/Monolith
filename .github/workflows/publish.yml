name: Publish

on:
  workflow_dispatch:
  # Frontier: re-enabled autopublish bawk

concurrency:
  group: publish

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: sudo apt-get install -y python3-paramiko python3-lxml

    - uses: actions/checkout@v3.6.0
      with:
        submodules: 'recursive'
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3.2.0
      with:
        dotnet-version: 9.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform linux-x64 --hybrid-acz
      
    # --- Publish artifacts --- 
    - name: Upload server artifact
      uses: actions/upload-artifact@v4
      with:
        name: ss14-server-linux
        path: ./release/SS14.Server_linux-x64.zip

    - name: Publish version  # Push client to CDN
      run: Tools/publish_client.py
      env:
        PUBLISH_TOKEN : ${{ secrets.PUBLISH_TOKEN }}
        ROBUST_CDN_URL: ${{ vars.ROBUST_CDN_URL }}
        FORK_ID       : ${{ vars.FORK_ID }}
  
  docker:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3.6.0

      - name: Download server artifact
        uses: actions/download-artifact@v4
        with:
          name: ss14-server-linux
          path: docker-build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            SERVER_ZIP=./docker-build/SS14.Server_linux-x64.zip
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/monolith-server:latest
            ghcr.io/${{ github.repository_owner }}/monolith-server:${{ github.sha }}
  
