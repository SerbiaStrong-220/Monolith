name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*-*'
      - 'v*.*.*'

concurrency:
  group: publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/monolith-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}


    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Extract version from tag
      id: version
      run: |
        if [[ ${{ github.ref }} == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}  # Убираем 'v' если есть
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_with_v=v${VERSION}" >> $GITHUB_OUTPUT
        else
          echo "version=dev-${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "tag_with_v=dev" >> $GITHUB_OUTPUT
        fi
    
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5.1.0
      with:
        dotnet-version: 9.0.x
        cache: true
        cache-dependency-path: '**/packages.lock.json'
    
    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    # --- Packaging
    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform linux-x64 --hybrid-acz
    # ---   
      
    # --- Dockerized  
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
          type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VCS_REF=${{ github.sha }}
          
    - name: Create Release (only on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: Release ${{ steps.version.outputs.tag_with_v }}
        body: |
          Docker image: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}`
          SHA: `${{ github.sha }}`
        draft: false
        prerelease: false
    # ---
