# Generated with DeepSeek, i don't give a fuck
name: Validate OGG Audio Channels

on:
  pull_request:
    paths:
      - '**.ogg'
      - '.github/workflows/fuck-mono-audio.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-ogg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Find and validate OGG files
        id: validate-ogg
        run: |
          echo "Looking for OGG files changed in PR..."

          # Get changed files in PR
          echo "Getting changed files..."
          changed_files=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -i '\.ogg$' || true)

          if [ -z "$changed_files" ]; then
            echo "No OGG files changed in this PR"
            echo "ogg_changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Changed OGG files:"
          echo "$changed_files"
          echo "ogg_changed=true" >> $GITHUB_OUTPUT

          # Run validation on changed files
          python Tools/Exodus/FuckMono/validate_ogg.py $changed_files

      - name: Convert stereo files to mono
        id: convert-stereo
        if: steps.validate-ogg.outputs.has_stereo == 'true'
        run: |
          echo "Converting stereo files to mono..."

          # Convert files
          stereo_files="${{ steps.validate-ogg.outputs.stereo_files }}"
          python Tools/Exodus/FuckMono/convert_to_mono.py $stereo_files

      - name: Commit and push converted files
        if: steps.convert-stereo.outputs.converted_count > 0
        run: |
          echo "Committing converted mono files..."

          # Configure git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add converted files
          stereo_files="${{ steps.validate-ogg.outputs.stereo_files }}"
          for file in $stereo_files; do
              if [ -f "$file" ]; then
                  git add "$file"
              fi
          done

          # Check if there are changes to commit
          if git diff --cached --quiet; then
              echo "No changes to commit"
          else
              git commit -m "ci: convert stereo OGG files to mono"
              git push
          fi

      - name: Create PR comment
        id: pr-comment
        run: |
          python Tools/Exodus/FuckMono/create_pr_comment.py > comment_body.md
          {
            echo "comment_body<<EOF"
            cat comment_body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          HAS_STEREO: ${{ steps.validate-ogg.outputs.has_stereo }}
          CONVERTED_COUNT: ${{ steps.convert-stereo.outputs.converted_count || 0 }}
          STEREO_FILES: ${{ steps.validate-ogg.outputs.stereo_files }}

      - name: Post PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            // Find existing bot comment
            const botComment = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('🎵 OGG Audio Validation')
            );

            const commentBody = `${{ steps.pr-comment.outputs.comment_body }}`;

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
            }
